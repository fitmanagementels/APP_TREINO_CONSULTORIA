<script>
var ManagerApp = (function () {
  var state = { page: "alunos", alunos: [], selectedAlunoId: "", search: "", showProfileForm: false, editingAlunoId: "", fichas: [], editor: null, draftItems: [], catalogEditingId: "" };
  var MUSCLES = [["coef_gluteos", "Glúteos"], ["coef_posterior_coxa", "Posterior"], ["coef_quadriceps", "Quadríceps"], ["coef_panturrilha", "Panturrilha"], ["coef_peitoral", "Peitoral"], ["coef_dorsal", "Dorsal"], ["coef_deltoide_anterior", "Deltoide ant."], ["coef_deltoide_posterior", "Deltoide post."], ["coef_biceps", "Bíceps"], ["coef_triceps", "Tríceps"], ["coef_antebraco", "Antebraço"], ["coef_abdomen", "Abdômen"], ["coef_eretores", "Eretores"]];

  function root() { return document.getElementById("app-root"); }
  function esc(value) { return String(value === undefined || value === null ? "" : value).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;"); }
  function loader(visible) { var node = document.getElementById("global-loader"); if (node) node.style.display = visible ? "flex" : "none"; }
  function selectedAluno() { for (var i = 0; i < state.alunos.length; i += 1) if (String(state.alunos[i].aluno_id) === state.selectedAlunoId) return state.alunos[i]; return null; }
  function currentFicha() { return state.editor && state.editor.ficha ? state.editor.ficha : null; }
  function catalog() { return state.editor && state.editor.catalogo ? state.editor.catalogo : []; }
  function exercise(id) { var list = catalog(); for (var i = 0; i < list.length; i += 1) if (String(list[i].exercicio_id) === String(id)) return list[i]; return null; }

  function call(action, data, success, failure) {
    if (!window.google || !google.script || !google.script.run) { if (failure) failure({ error: "A prévia local não grava dados." }); return; }
    google.script.run.withSuccessHandler(success).withFailureHandler(function () { if (failure) failure({ error: "Não foi possível concluir a operação." }); }).routeManagerAction({ action: action, data: data || {} });
  }
  function refresh(done) {
    call("getBootstrap", {}, function (response) { state.alunos = response && response.data && response.data.alunos ? response.data.alunos : []; if (done) done(); }, function () { if (done) done(); });
  }
  function loadFichas(done) {
    if (!state.selectedAlunoId) { state.fichas = []; state.editor = null; if (done) done(); return; }
    call("listFichas", { aluno_id: state.selectedAlunoId }, function (response) { state.fichas = response && response.success ? response.fichas : []; if (done) done(); }, function () { if (done) done(); });
  }
  function loadEditor(fichaId, done) {
    call("getPrescricaoEditorData", { ficha_id: fichaId }, function (response) { if (response && response.success) { state.editor = response; state.draftItems = response.itens || []; } if (done) done(); }, function () { if (done) done(); });
  }

  function renderStudentForm(aluno) {
    aluno = aluno || {};
    return "<section class=\"profile-form-card\"><div class=\"section-heading\"><div><p class=\"eyebrow\">" + (aluno.aluno_id ? "EDIÇÃO" : "NOVO ALUNO") + "</p><h2>" + (aluno.aluno_id ? "Editar perfil" : "Cadastrar aluno") + "</h2></div><button type=\"button\" class=\"text-button\" id=\"cancel-profile\">Cancelar</button></div><form id=\"profile-form\" class=\"profile-form\"><label>Nome<input name=\"nome\" required value=\"" + esc(aluno.nome) + "\" /></label><label>Telefone com DDD<input name=\"telefone_e164\" required inputmode=\"tel\" value=\"" + esc(aluno.telefone_e164) + "\" /></label><label>Status<select name=\"status\"><option value=\"ativo\"" + (!aluno.status || aluno.status === "ativo" ? " selected" : "") + ">Ativo</option><option value=\"pausado\"" + (aluno.status === "pausado" ? " selected" : "") + ">Pausado</option></select></label><label class=\"full-width\">Observações de gestão<textarea name=\"observacoes_gestao\" rows=\"3\">" + esc(aluno.observacoes_gestao) + "</textarea></label><button class=\"primary-button\" type=\"submit\">Salvar perfil</button><p id=\"profile-error\" class=\"form-error\"></p></form></section>";
  }
  function renderAlunos() {
    if (state.showProfileForm) return renderStudentForm(state.editingAlunoId ? selectedAluno() : null);
    var aluno = selectedAluno();
    var query = state.search.toLowerCase();
    var rows = state.alunos.filter(function (item) { return String(item.nome).toLowerCase().indexOf(query) !== -1; }).map(function (item) { return "<button class=\"student-row" + (String(item.aluno_id) === state.selectedAlunoId ? " is-selected" : "") + "\" type=\"button\" data-aluno-id=\"" + esc(item.aluno_id) + "\"><strong>" + esc(item.nome) + "</strong><span>" + esc(item.status || "ativo") + "</span></button>"; }).join("");
    var detail = aluno ? "<aside class=\"profile-detail\"><p class=\"eyebrow\">PERFIL DO ALUNO</p><h2>" + esc(aluno.nome) + "</h2><p class=\"status-chip\">" + esc(aluno.status || "ativo") + "</p><dl><dt>Telefone</dt><dd>+" + esc(aluno.telefone_e164) + "</dd><dt>Instância</dt><dd>Aguardando provisionamento</dd></dl><div class=\"detail-actions\"><a class=\"primary-button\" target=\"_blank\" rel=\"noopener\" href=\"" + esc(aluno.whatsapp_url) + "\">Abrir WhatsApp</a><button id=\"edit-profile\" class=\"secondary-button\" type=\"button\">Editar perfil</button></div></aside>" : "<aside class=\"profile-detail empty-detail\"><p>Selecione um aluno para visualizar o perfil.</p></aside>";
    return "<section class=\"section-heading\"><div><p class=\"eyebrow\">BASE CENTRAL</p><h2>Alunos</h2><p>Perfis, contato e situação de cada instância single-tenant.</p></div><button id=\"new-profile\" class=\"primary-button\" type=\"button\">Novo aluno</button></section><section class=\"students-layout\"><div class=\"student-list-card\"><label class=\"search-label\">Buscar aluno<input id=\"aluno-search\" type=\"search\" value=\"" + esc(state.search) + "\" placeholder=\"Digite um nome\" /></label><div class=\"student-list\">" + (rows || "<p class=\"empty-list\">Nenhum aluno encontrado.</p>") + "</div></div>" + detail + "</section>";
  }

  function demandPreview() {
    var result = [];
    for (var week = 1; week <= 4; week += 1) {
      var totals = {};
      for (var itemIndex = 0; itemIndex < state.draftItems.length; itemIndex += 1) {
        var item = state.draftItems[itemIndex]; var ex = exercise(item.exercicio_id); var series = Number(item["semana_" + week + "_series"]) || 0;
        if (!ex) continue;
        for (var m = 0; m < MUSCLES.length; m += 1) totals[MUSCLES[m][0]] = (totals[MUSCLES[m][0]] || 0) + (Number(ex[MUSCLES[m][0]]) || 0) * series;
      }
      var labels = []; for (var index = 0; index < MUSCLES.length; index += 1) if (totals[MUSCLES[index][0]]) labels.push(MUSCLES[index][1] + ": " + totals[MUSCLES[index][0]].toFixed(1));
      result.push("<div><strong>Ciclo " + week + "</strong><span>" + (labels.join(" · ") || "Adicione exercícios") + "</span></div>");
    }
    return "<section class=\"demand-preview\"><p class=\"eyebrow\">PRÉVIA DE DEMANDA</p><div>" + result.join("") + "</div></section>";
  }
  function renderCatalog() {
    var selected = state.catalogEditingId ? exercise(state.catalogEditingId) : null;
    var fields = MUSCLES.map(function (field) { return "<label>" + field[1] + "<input name=\"" + field[0] + "\" type=\"number\" min=\"0\" step=\"0.25\" value=\"" + esc(selected ? selected[field[0]] : 0) + "\" /></label>"; }).join("");
    var rows = catalog().map(function (item) { return "<button type=\"button\" class=\"catalog-row\" data-catalog-id=\"" + esc(item.exercicio_id) + "\">" + esc(item.nome_exercicio) + " <span>v" + esc(item.versao_catalogo) + "</span></button>"; }).join("");
    return "<details class=\"catalog-details\"><summary>Catálogo de exercícios (" + catalog().length + ")</summary><div class=\"catalog-content\"><div class=\"catalog-list\">" + (rows || "<p>Nenhum exercício cadastrado.</p>") + "</div><form id=\"catalog-form\" class=\"catalog-form\"><p class=\"eyebrow\">" + (selected ? "EDITAR EXERCÍCIO" : "NOVO EXERCÍCIO") + "</p><label>Exercício<input name=\"nome_exercicio\" required value=\"" + esc(selected && selected.nome_exercicio) + "\" /></label><label>Grupo muscular<input name=\"grupo_muscular\" required value=\"" + esc(selected && selected.grupo_muscular) + "\" /></label><label>Tipo<input name=\"tipo_exercicio\" required value=\"" + esc(selected && selected.tipo_exercicio) + "\" /></label><label>Ativo<select name=\"ativo\"><option value=\"true\">Sim</option><option value=\"false\"" + (selected && String(selected.ativo) === "false" ? " selected" : "") + ">Não</option></select></label><div class=\"coefficient-grid\">" + fields + "</div><button class=\"secondary-button\" type=\"submit\">Salvar exercício</button><p id=\"catalog-error\" class=\"form-error\"></p></form></div></details>";
  }
  function renderEditor() {
    if (!currentFicha()) return "<section class=\"page-card\"><p>Selecione uma ficha para editar o rascunho.</p></section>";
    var options = catalog().map(function (item) { return "<option value=\"" + esc(item.exercicio_id) + "\">" + esc(item.nome_exercicio) + "</option>"; }).join("");
    var cycles = []; for (var w = 1; w <= 4; w += 1) cycles.push("<fieldset><legend>Ciclo " + w + "</legend><label>Séries<input type=\"number\" min=\"0\" name=\"semana_" + w + "_series\" value=\"0\" /></label><label>Repetições<input name=\"semana_" + w + "_repeticoes\" /></label><label>Descanso (s)<input type=\"number\" min=\"0\" name=\"semana_" + w + "_descanso_segundos\" value=\"0\" /></label><label>Zona RIR<input name=\"semana_" + w + "_zona_rir\" placeholder=\"ex.: 1–3\" /></label></fieldset>");
    var items = state.draftItems.map(function (item, i) { var ex = exercise(item.exercicio_id); return "<li><span><strong>" + esc(ex ? ex.nome_exercicio : "Exercício removido") + "</strong> · " + esc(item.nome_treino) + "</span><button class=\"text-button remove-item\" type=\"button\" data-index=\"" + i + "\">Remover</button></li>"; }).join("");
    return "<section class=\"editor-card\"><p class=\"eyebrow\">RASCUNHO · V" + esc(state.editor.prescricao && state.editor.prescricao.versao) + "</p><h2>" + esc(currentFicha().nome_ficha) + "</h2><p class=\"muted-text\">Oculta e inativa até a futura revisão/publicação.</p><ul class=\"draft-items\">" + (items || "<li>Nenhum exercício adicionado.</li>") + "</ul><form id=\"add-item-form\" class=\"draft-item-form\"><label>Treino<input name=\"nome_treino\" value=\"Treino principal\" /></label><label>Exercício<select name=\"exercicio_id\" required><option value=\"\">Selecione</option>" + options + "</select></label><div class=\"cycle-grid\">" + cycles.join("") + "</div><button class=\"secondary-button\" type=\"submit\">Adicionar exercício</button></form>" + demandPreview() + "<button id=\"save-draft\" class=\"primary-button\" type=\"button\">Salvar nova versão do rascunho</button><p id=\"draft-error\" class=\"form-error\"></p></section>" + renderCatalog();
  }
  function renderPrescricoes() {
    var aluno = selectedAluno();
    if (!aluno) return renderEmpty("Prescrições", "Selecione um aluno na página Alunos antes de criar uma ficha.");
    var fichas = state.fichas.map(function (ficha) { return "<button class=\"ficha-row" + (currentFicha() && String(currentFicha().ficha_id) === String(ficha.ficha_id) ? " is-selected" : "") + "\" type=\"button\" data-ficha-id=\"" + esc(ficha.ficha_id) + "\"><strong>" + esc(ficha.nome_ficha) + "</strong><span>rascunho · " + esc(ficha.visibilidade_aluno) + " · " + esc(ficha.estado_uso) + "</span></button>"; }).join("");
    return "<section class=\"section-heading\"><div><p class=\"eyebrow\">PRESCRIÇÕES DE " + esc(aluno.nome) + "</p><h2>Fichas em rascunho</h2></div></section><form id=\"new-ficha-form\" class=\"inline-form\"><label>Nome da nova ficha<input name=\"nome_ficha\" required placeholder=\"Ex.: Hipertrofia A\" /></label><button class=\"primary-button\" type=\"submit\">Criar ficha</button><p id=\"ficha-error\" class=\"form-error\"></p></form><section class=\"prescription-layout\"><div class=\"student-list-card\"><p class=\"eyebrow\">FICHAS</p><div class=\"student-list\">" + (fichas || "<p class=\"empty-list\">Nenhuma ficha criada.</p>") + "</div></div>" + renderEditor() + "</section>";
  }
  function renderEmpty(title, message) { return "<section class=\"page-card\"><p class=\"eyebrow\">EM CONSTRUÇÃO</p><h2>" + title + "</h2><p>" + message + "</p></section>"; }
  function render() { var node = root(); if (!node) return; if (state.page === "alunos") node.innerHTML = renderAlunos(); else if (state.page === "prescricoes") node.innerHTML = renderPrescricoes(); else if (state.page === "acompanhamento") node.innerHTML = renderEmpty("Acompanhamento", "Indicadores de execução serão exibidos aqui."); else node.innerHTML = renderEmpty("Saúde do App", "Erros e sincronizações dos apps dos alunos serão monitorados aqui."); bindPage(); }

  function bindPage() {
    var newProfile = document.getElementById("new-profile"); if (newProfile) newProfile.onclick = function () { state.showProfileForm = true; state.editingAlunoId = ""; render(); };
    var cancel = document.getElementById("cancel-profile"); if (cancel) cancel.onclick = function () { state.showProfileForm = false; render(); };
    var edit = document.getElementById("edit-profile"); if (edit) edit.onclick = function () { state.showProfileForm = true; state.editingAlunoId = state.selectedAlunoId; render(); };
    var search = document.getElementById("aluno-search"); if (search) search.oninput = function () { state.search = this.value; render(); };
    var students = document.querySelectorAll(".student-row"); for (var i = 0; i < students.length; i += 1) students[i].onclick = function () { state.selectedAlunoId = this.getAttribute("data-aluno-id"); render(); };
    var profileForm = document.getElementById("profile-form"); if (profileForm) profileForm.onsubmit = saveProfile;
    var fichaForm = document.getElementById("new-ficha-form"); if (fichaForm) fichaForm.onsubmit = createFicha;
    var fichaRows = document.querySelectorAll(".ficha-row"); for (var f = 0; f < fichaRows.length; f += 1) fichaRows[f].onclick = function () { loadEditor(this.getAttribute("data-ficha-id"), render); };
    var itemForm = document.getElementById("add-item-form"); if (itemForm) itemForm.onsubmit = addItem;
    var remove = document.querySelectorAll(".remove-item"); for (var r = 0; r < remove.length; r += 1) remove[r].onclick = function () { state.draftItems.splice(Number(this.getAttribute("data-index")), 1); render(); };
    var save = document.getElementById("save-draft"); if (save) save.onclick = saveDraft;
    var catalogForm = document.getElementById("catalog-form"); if (catalogForm) catalogForm.onsubmit = saveCatalog;
    var catalogRows = document.querySelectorAll(".catalog-row"); for (var c = 0; c < catalogRows.length; c += 1) catalogRows[c].onclick = function () { state.catalogEditingId = this.getAttribute("data-catalog-id"); render(); };
  }
  function saveProfile(event) { event.preventDefault(); var form = event.target; var error = document.getElementById("profile-error"); call("saveAluno", { aluno_id: state.editingAlunoId, nome: form.nome.value, telefone_e164: form.telefone_e164.value, status: form.status.value, observacoes_gestao: form.observacoes_gestao.value }, function (response) { if (!response || !response.success) { error.textContent = response && response.error ? response.error : "Não foi possível salvar."; return; } state.selectedAlunoId = response.aluno.aluno_id; state.showProfileForm = false; state.editingAlunoId = ""; refresh(render); }, function (response) { error.textContent = response.error; }); }
  function createFicha(event) { event.preventDefault(); var form = event.target; var error = document.getElementById("ficha-error"); call("createFicha", { aluno_id: state.selectedAlunoId, nome_ficha: form.nome_ficha.value }, function (response) { if (!response || !response.success) { error.textContent = response && response.error ? response.error : "Não foi possível criar."; return; } loadFichas(function () { loadEditor(response.ficha.ficha_id, render); }); }, function (response) { error.textContent = response.error; }); }
  function addItem(event) { event.preventDefault(); var form = event.target; if (!form.exercicio_id.value) return; var item = { exercicio_id: form.exercicio_id.value, treino_id: "treino-principal", nome_treino: form.nome_treino.value || "Treino principal" }; for (var w = 1; w <= 4; w += 1) { item["semana_" + w + "_series"] = form["semana_" + w + "_series"].value; item["semana_" + w + "_repeticoes"] = form["semana_" + w + "_repeticoes"].value; item["semana_" + w + "_descanso_segundos"] = form["semana_" + w + "_descanso_segundos"].value; item["semana_" + w + "_zona_rir"] = form["semana_" + w + "_zona_rir"].value; } state.draftItems.push(item); render(); }
  function saveDraft() { var error = document.getElementById("draft-error"); call("savePrescricaoDraft", { ficha_id: currentFicha().ficha_id, prescricao_id: state.editor.prescricao && state.editor.prescricao.prescricao_id, itens: state.draftItems }, function (response) { if (!response || !response.success) { error.textContent = response && response.error ? response.error : "Não foi possível salvar."; return; } loadFichas(function () { loadEditor(currentFicha().ficha_id, render); }); }, function (response) { error.textContent = response.error; }); }
  function saveCatalog(event) { event.preventDefault(); var form = event.target; var data = { exercicio_id: state.catalogEditingId, nome_exercicio: form.nome_exercicio.value, grupo_muscular: form.grupo_muscular.value, tipo_exercicio: form.tipo_exercicio.value, ativo: form.ativo.value }; for (var i = 0; i < MUSCLES.length; i += 1) data[MUSCLES[i][0]] = form[MUSCLES[i][0]].value; var error = document.getElementById("catalog-error"); call("saveCatalogoExercicio", data, function (response) { if (!response || !response.success) { error.textContent = response && response.error ? response.error : "Não foi possível salvar."; return; } state.catalogEditingId = ""; loadEditor(currentFicha().ficha_id, render); }, function (response) { error.textContent = response.error; }); }
  function selectPage(page) { state.page = page; var buttons = document.querySelectorAll(".nav-button"); for (var i = 0; i < buttons.length; i += 1) buttons[i].className = buttons[i].getAttribute("data-page") === page ? "nav-button is-active" : "nav-button"; if (page === "prescricoes") loadFichas(render); else render(); }
  function boot() { var buttons = document.querySelectorAll(".nav-button"); for (var i = 0; i < buttons.length; i += 1) buttons[i].onclick = function () { selectPage(this.getAttribute("data-page")); }; refresh(function () { document.getElementById("connection-status").textContent = window.google && google.script && google.script.run ? "Pronto" : "Prévia local"; render(); loader(false); }); }
  return { boot: boot, selectPage: selectPage };
}());
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", ManagerApp.boot); else ManagerApp.boot();
</script>
