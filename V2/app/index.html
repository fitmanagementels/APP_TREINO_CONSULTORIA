  <main class="student-app">
    <header class="student-header">
      <div><p class="eyebrow">XSTEAM</p><h1 id="page-title">Treino</h1></div>
      <button class="icon-button" type="button" onclick="App.refresh()" aria-label="Atualizar">↻</button>
    </header>
    <div id="sync-state" class="sync-state">Sincronizado</div>

    <section id="screen-treino" class="student-screen active">
      <div id="treino-setup" class="panel"></div>
      <div id="session-area"></div>
    </section>

    <section id="screen-fichas" class="student-screen">
      <div class="section-heading"><p class="eyebrow">LEITURA</p><h2>Suas fichas</h2></div>
      <div id="fichas-list"></div>
    </section>

    <section id="screen-historico" class="student-screen">
      <div class="section-heading"><p class="eyebrow">SESSÕES</p><h2>Histórico de treino</h2></div>
      <div id="historico-list"></div>

    <section id="screen-progresso" class="student-screen">
      <div class="section-heading"><p class="eyebrow">EVOLUÇÃO</p><h2>Progresso</h2></div>
      <div class="period-filter" id="period-filter">
        <button type="button" data-period="4" onclick="App.loadProgress(4)">4 sem</button>
        <button type="button" data-period="8" class="selected" onclick="App.loadProgress(8)">8 sem</button>
        <button type="button" data-period="12" onclick="App.loadProgress(12)">12 sem</button>
        <button type="button" data-period="all" onclick="App.loadProgress('all')">Tudo</button>
      </div>
      <div id="progresso-content" class="panel empty-state">Carregando progresso...</div>
    </section>
  </main>

  <nav class="student-nav" aria-label="Navegação principal">

  </nav>
