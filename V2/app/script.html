<script>
var App = {
  bootstrap: null,
  activeFicha: null,
  currentSession: null,
  currentScreen: "treino",
  RIR_OPTIONS: ["-", "0", "0.5", "1", "1.5", "2", "2.5", "3", "3.5", "4", "4.5", "5", "6+"],
  init: function init() {
    this.restorePendingSession();
    this.refresh();
  },
  call: function call(action, payload) {
    return new Promise(function (resolve, reject) {
      var request = { action: action, payload: payload || {} };
      if (window.google && google.script && google.script.run) {
        google.script.run.withSuccessHandler(function (result) {
          if (!result || result.success === false) reject(new Error(result && result.error || "Falha ao carregar dados."));
          else resolve(result.data === undefined ? result : result.data);
        }).withFailureHandler(function (error) {
          reject(new Error(error && error.message || "Falha de comunicação."));
        }).routeAction(request);
      } else {
        reject(new Error("Abra o aplicativo pela implementação do Apps Script."));
      }
    });
  },
  refresh: function refresh() {
    var self = this;
    this.setSync("Atualizando...");
    this.call("getTenantBootstrap").then(function (data) {
      self.bootstrap = data || {};
      self.activeFicha = self.bootstrap.ficha_ativa || null;
      self.renderAll();
      self.setSync("Sincronizado");
    }).catch(function (error) {
      self.setSync("Dados locais");
      self.toast(error.message);
      self.renderAll();
    });
  },
  renderAll: function renderAll() {
    this.renderTreinoSetup();
    this.renderFichas();
    this.renderHistorico();
    if (this.currentScreen === "progresso") this.loadProgress(8);
  },
  goTo: function goTo(screen) {
    this.currentScreen = screen;
    var screens = document.querySelectorAll(".student-screen");
    var navs = document.querySelectorAll(".nav-item");
    for (var i = 0; i < screens.length; i++) screens[i].classList.toggle("active", screens[i].id === "screen-" + screen);
    for (var j = 0; j < navs.length; j++) navs[j].classList.toggle("active", navs[j].getAttribute("data-screen") === screen);
    document.getElementById("page-title").textContent = screen === "treino" ? "Treino" : screen === "fichas" ? "Fichas" : screen === "historico" ? "Histórico" : "Progresso";
    if (screen === "progresso") this.loadProgress(8);
  },
  renderTreinoSetup: function renderTreinoSetup() {
    var root = document.getElementById("treino-setup");
    if (this.currentSession) { root.innerHTML = ""; return; }
    if (!this.activeFicha) {
      root.innerHTML = '<div class="empty-state"><strong>Nenhuma ficha ativa</strong><br>Quando seu treinador ativar uma ficha, ela aparecerá aqui.</div>';
      return;
    }
    var treinos = this.getTreinosAtivos();
    var options = treinos.map(function (item) { return '<option value="' + App.escape(item) + '">' + App.escape(item) + "</option>"; }).join("");
    var last = this.bootstrap && this.bootstrap.historico && this.bootstrap.historico[0];
    root.innerHTML = '<p class="eyebrow">FICHA ATIVA</p><h2>' + this.escape(this.activeFicha.nome_ficha) + '</h2><p class="muted">Escolha um treino para carregar seus exercícios.</p><label class="field-label">Treino</label><select id="treino-select">' + options + '</select><button class="primary-button" type="button" onclick="App.startTraining()">Iniciar treino</button>' + (last ? '<p class="last-training">Último treino: <strong>' + this.escape(String(last.treino_id || "sessão")) + "</strong></p>" : '<p class="last-training">Ainda não há treino registrado.</p>');
  },
  getTreinosAtivos: function getTreinosAtivos() {
    var provided = this.bootstrap && this.bootstrap.treinos_ativos || [];
    if (provided.length) return provided;    var history = this.bootstrap && this.bootstrap.historico || [];
    var known = [];
    for (var i = 0; i < history.length; i++) if (history[i].ficha_id === this.activeFicha.ficha_id && known.indexOf(history[i].treino_id) === -1) known.push(history[i].treino_id);
    return known.length ? known : ["A"];
  },
  startTraining: function startTraining() {
    var self = this;
    var select = document.getElementById("treino-select");
    if (!select || !select.value) return this.toast("Selecione um treino.");
    this.setSync("Carregando treino...");
    this.call("getTreinoSession", { treino_id: select.value, ciclo: "1" }).then(function (data) {
      self.currentSession = {
        id_sessao: "sess_" + Date.now(),
        id_operacao: "op_" + Date.now() + "_" + Math.floor(Math.random() * 100000),
        ficha_id: data.ficha.ficha_id,
        treino_id: data.treino_id,
        data_treino: new Date().toISOString(),
        catalogo: data.catalogo || [],
        exercicios: self.hydrateExercises(data.exercicios || []),
        pse: ""
      };
      self.saveSessionDraft();
      self.renderSession();
      self.setSync("Rascunho salvo neste aparelho");
    }).catch(function (error) { self.setSync("Sincronizado"); self.toast(error.message); });
  },
  hydrateExercises: function hydrateExercises(items) {
    return items.map(function (item) {
      var series = [];
      var count = Number(item.sets || 1);
      for (var i = 0; i < count; i++) series.push({ carga_absoluta: "", reps_executadas: "", rir: "-" });
      item.series = series;
      item.tipo_execucao = "prescrito";
      item.exercicio_prescrito_id = item.exercicio_id;
      item.estado_execucao = "realizado";
      return item;
    });
  },
  renderSession: function renderSession() {
    var area = document.getElementById("session-area");
    if (!this.currentSession) { area.innerHTML = ""; return; }
    var cards = "";
    for (var i = 0; i < this.currentSession.exercicios.length; i++) cards += this.exerciseCard(this.currentSession.exercicios[i], i);
    area.innerHTML = '<div class="session-header"><p class="eyebrow">EM ANDAMENTO</p><h2>' + this.escape(this.currentSession.treino_id) + '</h2><button type="button" class="link-button" onclick="App.openPreviousModal()">Mostrar treino anterior</button></div><div id="exercise-cards">' + cards + '</div><button class="secondary-button" type="button" onclick="App.addExtraExercise()">+ Adicionar exercício extra</button><button class="primary-button" type="button" onclick="App.finishTraining()">Finalizar treino</button>';
  },
  exerciseCard: function exerciseCard(item, index) {
    if (item.estado_execucao === "nao_realizado") return '<div class="omitted-card"><strong>' + this.escape(item.nome_exercicio) + '</strong><span>Não realizado nesta sessão</span><button type="button" onclick="App.undoRemove(' + index + ')">Desfazer</button></div>';
    var tags = item.tipo_execucao === "substituto" ? '<span class="tag">Substituto</span>' : item.tipo_execucao === "extra" ? '<span class="tag">Extra</span>' : "";
    var series = "";
    for (var i = 0; i < item.series.length; i++) {
      var row = item.series[i];
      series += '<div class="series-row"><span>S' + (i + 1) + '</span><input inputmode="decimal" placeholder="Carga" value="' + this.escape(row.carga_absoluta) + '" onchange="App.updateSeries(' + index + ',' + i + ',0,this.value)"><input inputmode="numeric" placeholder="Reps" value="' + this.escape(row.reps_executadas) + '" onchange="App.updateSeries(' + index + ',' + i + ',1,this.value)"><select onchange="App.updateRirSelect(' + index + ',' + i + ',this)">' + this.rirOptions(row.rir) + '</select><input class="rir-range" type="range" min="0" max="12" step="1" value="' + this.rirIndex(row.rir) + '" oninput="App.updateRirFromRange(' + index + ',' + i + ',this)"></div>';
    }
    return '<article class="exercise-card"><div class="exercise-title"><div><h3>' + this.escape(item.nome_exercicio) + '</h3>' + tags + '<p>' + this.escape(String(item.sets || "") + " × " + String(item.reps || "")) + ' · RIR alvo: ' + this.escape(item.zona_rir || "-") + '</p></div><button class="icon-button" type="button" onclick="App.openSubstituteModal(' + index + ')" aria-label="Substitutos">⇄</button></div><div class="series-head"><span>Série</span><span>Carga</span><span>Reps</span><span>RIR</span></div>' + series + '<div class="card-actions"><button type="button" onclick="App.removeFromSession(' + index + ')">Remover da sessão</button><button type="button" onclick="App.openPreviousModal(' + index + ')">Referência</button></div></article>';
  },
  rirOptions: function rirOptions(selected) {
    var html = "";
    for (var i = 0; i < this.RIR_OPTIONS.length; i++) html += '<option value="' + this.RIR_OPTIONS[i] + '"' + (String(selected) === this.RIR_OPTIONS[i] ? " selected" : "") + ">" + this.RIR_OPTIONS[i] + "</option>";
    return html;
  },
  rirIndex: function rirIndex(value) {
    var index = this.RIR_OPTIONS.indexOf(String(value));
    return index < 0 ? 0 : index;
  },
  updateRirSelect: function updateRirSelect(exerciseIndex, seriesIndex, element) {
    var value = element.value;
    this.currentSession.exercicios[exerciseIndex].series[seriesIndex].rir = value;
    var range = element.parentNode.querySelector(".rir-range");
    if (range) range.value = this.rirIndex(value);
    this.saveSessionDraft();
  },
  updateRirFromRange: function updateRirFromRange(exerciseIndex, seriesIndex, element) {
    var value = this.RIR_OPTIONS[Number(element.value)] || "-";
    this.currentSession.exercicios[exerciseIndex].series[seriesIndex].rir = value;
    var select = element.parentNode.querySelector("select");
    if (select) select.value = value;
    this.saveSessionDraft();
  },  updateSeries: function updateSeries(exerciseIndex, seriesIndex, field, value) {
    var fields = ["carga_absoluta", "reps_executadas", "rir"];
    this.currentSession.exercicios[exerciseIndex].series[seriesIndex][fields[field]] = value;
    this.saveSessionDraft();
  },
  saveSessionDraft: function saveSessionDraft() {
    if (this.currentSession) localStorage.setItem("xsteam_v2_session_draft", JSON.stringify(this.currentSession));
  },
  restorePendingSession: function restorePendingSession() {
    try {
      var raw = localStorage.getItem("xsteam_v2_session_draft");
      if (!raw) return;
      this.currentSession = JSON.parse(raw);
      this.showResumeDecision();
    } catch (error) { localStorage.removeItem("xsteam_v2_session_draft"); }
  },
  showResumeDecision: function showResumeDecision() {
    this.modal('<h2>Treino em andamento</h2><p>Encontramos um preenchimento salvo neste aparelho.</p><div class="modal-actions"><button class="secondary-button" type="button" onclick="App.discardPendingSession()">Descartar</button><button class="primary-button" type="button" onclick="App.resumePendingSession()">Retomar</button></div>');
  },
  resumePendingSession: function resumePendingSession() {
    this.closeModal();
    this.goTo("treino");
    this.renderSession();
  },
  discardPendingSession: function discardPendingSession() {
    this.currentSession = null;
    localStorage.removeItem("xsteam_v2_session_draft");
    this.closeModal();
    this.renderTreinoSetup();
    this.renderSession();
    this.toast("Rascunho descartado.");
  },
  openSubstituteModal: function openSubstituteModal(index) {
    var item = this.currentSession.exercicios[index];
    var options = item.substitutos || [];
    if (!options.length) return this.toast("Não há substitutos liberados para este exercício.");
    var html = '<h2>Escolher substituto</h2><p>A troca vale apenas para esta sessão.</p>';
    for (var i = 0; i < options.length; i++) html += '<button class="substitute-option" type="button" onclick="App.applySubstitute(' + index + "," + i + ')"><strong>' + this.escape(options[i].nome_exercicio) + '</strong><span>' + this.escape(options[i].observacao || "Usar nesta sessão") + "</span></button>";
    this.modal(html);
  },
  applySubstitute: function applySubstitute(index, substituteIndex) {
    var original = this.currentSession.exercicios[index];
    var substitute = original.substitutos[substituteIndex];
    if (!window.confirm("Substituir apenas nesta sessão? A ficha não será alterada.")) return;
    original.exercicio_id = substitute.exercicio_id;
    original.nome_exercicio = substitute.nome_exercicio;
    original.tipo_execucao = "substituto";
    original.referencia = null;
    this.closeModal();
    this.saveSessionDraft();
    this.renderSession();
  },
  removeFromSession: function removeFromSession(index) {
    this.currentSession.exercicios[index].estado_execucao = "nao_realizado";
    this.saveSessionDraft();
    this.renderSession();
  },
  undoRemove: function undoRemove(index) {
    this.currentSession.exercicios[index].estado_execucao = "realizado";
    this.saveSessionDraft();
    this.renderSession();
  },
  addExtraExercise: function addExtraExercise() {
    var catalog = this.currentSession && this.currentSession.catalogo || [];
    var html = '<h2>Exercício extra</h2><input id="extra-search" placeholder="Buscar exercício" oninput="App.filterExtraCatalog()"><div id="extra-options">';
    for (var i = 0; i < catalog.length; i++) html += '<button type="button" class="substitute-option" data-extra="' + i + '" onclick="App.selectExtraExercise(' + i + ')"><strong>' + this.escape(catalog[i].nome_exercicio) + '</strong><span>' + this.escape(catalog[i].grupo_muscular) + "</span></button>";
    this.modal(html + "</div>");
  },
  filterExtraCatalog: function filterExtraCatalog() {
    var search = String(document.getElementById("extra-search").value || "").toLowerCase();
    var buttons = document.querySelectorAll("[data-extra]");
    for (var i = 0; i < buttons.length; i++) buttons[i].style.display = buttons[i].textContent.toLowerCase().indexOf(search) >= 0 ? "" : "none";
  },
  selectExtraExercise: function selectExtraExercise(index) {
    var exercise = this.currentSession.catalogo[index];
    this.currentSession.exercicios.push({ prescricao_item_id: "", exercicio_id: exercise.exercicio_id, exercicio_prescrito_id: "", nome_exercicio: exercise.nome_exercicio, ordem_exercicio: this.currentSession.exercicios.length + 1, sets: 1, reps: "", descanso: "", zona_rir: "-", series: [{ carga_absoluta: "", reps_executadas: "", rir: "-" }], substitutos: [], tipo_execucao: "extra", estado_execucao: "realizado" });
    this.closeModal();
    this.saveSessionDraft();
    this.renderSession();
  },
  openPreviousModal: function openPreviousModal(index) {
    var item = index === undefined ? null : this.currentSession.exercicios[index];
    var ref = item && item.referencia;
    if (!ref) return this.modal('<h2>Treino anterior</h2><p>Ainda não há referência salva para este exercício.</p>');
    this.modal('<h2>Treino anterior</h2><p><strong>' + this.escape(item.nome_exercicio) + '</strong></p><p>' + this.escape(String(ref.series_json || "Sem detalhes disponíveis.")) + "</p>");
  },
  finishTraining: function finishTraining() {
    var done = this.currentSession.exercicios.filter(function (item) { return item.estado_execucao === "realizado"; }).length;
    if (!done) return this.toast("Registre ao menos um exercício realizado.");
    this.modal('<h2>Finalizar treino</h2><p>' + done + ' exercício(s) realizado(s). A PSE da sessão é obrigatória.</p><label class="field-label">PSE (0 a 10)</label><input id="pse-range" type="range" min="0" max="10" step="1" value="5" oninput="App.syncPse(this.value)"><select id="pse-select" onchange="App.syncPse(this.value)">' + this.pseOptions() + '</select><div class="modal-actions"><button class="primary-button" type="button" onclick="App.syncSession()">Salvar treino</button></div>');
  },
  pseOptions: function pseOptions() {
    var html = "";
    for (var i = 0; i <= 10; i++) html += '<option value="' + i + '"' + (i === 5 ? " selected" : "") + ">" + i + "</option>";
    return html;
  },
  syncPse: function syncPse(value) {
    document.getElementById("pse-range").value = value;
    document.getElementById("pse-select").value = value;
  },
  syncSession: function syncSession() {
    var self = this;
    var pse = document.getElementById("pse-select").value;
    if (pse === "") return this.toast("A PSE da sessão é obrigatória.");
    var records = [];
    this.currentSession.exercicios.forEach(function (item) {
      item.series.forEach(function (series, index) {
        records.push({ prescricao_item_id: item.prescricao_item_id, exercicio_id: item.exercicio_id, exercicio_prescrito_id: item.exercicio_prescrito_id, tipo_execucao: item.tipo_execucao, estado_execucao: item.estado_execucao, ordem_exercicio: item.ordem_exercicio, serie: index + 1, carga_absoluta: series.carga_absoluta, reps_executadas: series.reps_executadas, rir: series.rir });
      });
    });
    this.setSync("Salvando treino...");
    this.call("syncTenantSession", { id_sessao: this.currentSession.id_sessao, id_operacao: this.currentSession.id_operacao, ficha_id: this.currentSession.ficha_id, treino_id: this.currentSession.treino_id, data_treino: this.currentSession.data_treino, pse: pse, records: records }).then(function () {
      self.currentSession = null;
      localStorage.removeItem("xsteam_v2_session_draft");
      self.closeModal();
      self.setSync("Sincronizado");
      self.toast("Treino salvo.");
      self.refresh();
    }).catch(function (error) {
      self.setSync("Rascunho salvo neste aparelho");
      self.toast("Não foi possível sincronizar: " + error.message);
    });
  },
  renderFichas: function renderFichas() {
    var root = document.getElementById("fichas-list");
    var fichas = this.bootstrap && this.bootstrap.fichas || [];
    root.innerHTML = fichas.length ? fichas.map(function (ficha, index) {
      var active = App.activeFicha && ficha.ficha_id === App.activeFicha.ficha_id;
      return '<article class="ficha-card' + (active ? " active-ficha" : "") + '"><h3>' + App.escape(ficha.nome_ficha) + '</h3><p>' + (active ? "Ficha ativa" : "Histórico de ficha") + '</p><span>Modo leitura</span><button class="secondary-button" type="button" onclick="App.openFichaDetail(' + index + ')">Ver ficha</button></article>';
    }).join("") : '<div class="empty-state">Nenhuma ficha visível.</div>';
  },
  openFichaDetail: function openFichaDetail(index) {
    var fichas = this.bootstrap && this.bootstrap.fichas || [];
    var ficha = fichas[index];
    var self = this;
    if (!ficha) return this.toast("Ficha não encontrada.");
    this.modal('<h2>Carregando ficha...</h2>');
    this.call("getFichaReadOnly", { ficha_id: ficha.ficha_id }).then(function (data) {
      self.renderFichaDetail(data);
    }).catch(function (error) {
      self.closeModal();
      self.toast(error.message);
    });
  },
  renderFichaDetail: function renderFichaDetail(data) {
    var ficha = data && data.ficha || {};
    var treinos = data && data.treinos || [];
    var html = '<p class="eyebrow">MODO LEITURA</p><h2>' + this.escape(ficha.nome_ficha || "Ficha") + '</h2><p class="muted">Esta visualização não altera sua ficha.</p>';
    for (var i = 0; i < treinos.length; i++) {
      var treino = treinos[i];
      html += '<section class="ficha-readonly"><h3>' + this.escape(treino.nome_treino || treino.id_treino) + '</h3>';
      for (var j = 0; j < treino.exercicios.length; j++) {
        var exercicio = treino.exercicios[j];
        html += '<div class="ficha-exercise"><strong>' + (j + 1) + '. ' + this.escape(exercicio.nome_exercicio) + '</strong>';
        for (var k = 0; k < exercicio.ciclos.length; k++) html += this.renderFichaCycle(exercicio.ciclos[k]);
        if (exercicio.observacoes) html += '<p class="muted">' + this.escape(exercicio.observacoes) + '</p>';
        html += '</div>';
      }
      html += '</section>';
    }
    if (!treinos.length) html += '<div class="empty-state">Esta ficha ainda não possui exercícios publicados.</div>';
    this.modal(html);
  },
  renderFichaCycle: function renderFichaCycle(ciclo) {
    var parts = [];
    if (ciclo.sets !== "" && ciclo.sets !== undefined) parts.push(ciclo.sets + " séries");
    if (ciclo.reps !== "" && ciclo.reps !== undefined) parts.push(ciclo.reps + " reps");
    if (ciclo.descanso !== "" && ciclo.descanso !== undefined) parts.push("descanso " + ciclo.descanso);
    if (ciclo.zona_rir !== "" && ciclo.zona_rir !== undefined) parts.push("RIR alvo " + ciclo.zona_rir);
    return '<p class="ficha-cycle"><span>Semana ' + ciclo.ciclo + '</span>' + this.escape(parts.join(" · ") || "Sem parâmetros") + '</p>';
  },
  renderHistorico: function renderHistorico() {
    var root = document.getElementById("historico-list");
    var sessions = this.bootstrap && this.bootstrap.historico || [];
    root.innerHTML = sessions.length ? sessions.map(function (session, index) {
      return '<button class="history-card history-button" type="button" onclick="App.openHistoricoDetail(' + index + ')"><p>' + App.escape(new Date(session.data_treino).toLocaleDateString("pt-BR")) + '</p><h3>Treino finalizado</h3><span>' + session.total_exercicios + " exercícios · " + session.total_series + ' séries</span><strong>' + Math.round(session.volume_total / 100) / 10 + "k</strong><small>PSE " + App.escape(session.pse || "-") + "</small></button>";
    }).join("") : '<div class="empty-state">Os treinos finalizados aparecerão aqui.</div>';
  },
  openHistoricoDetail: function openHistoricoDetail(index) {
    var sessions = this.bootstrap && this.bootstrap.historico || [];
    if (!sessions[index]) return this.toast("Treino não encontrado.");
    this.renderHistoricoDetail(sessions[index]);
  },
  renderHistoricoDetail: function renderHistoricoDetail(session) {
    var byExercise = {};
    var records = session.records || [];
    for (var i = 0; i < records.length; i++) {
      var record = records[i];
      var key = record.id_exercicio || "exercicio_" + i;
      if (!byExercise[key]) byExercise[key] = { nome: record.nome_exercicio || key, series: [] };
      byExercise[key].series.push(record);
    }
    var volume = Math.round(session.volume_total / 100) / 10 + "k";
    var html = '<h2>Treino: ' + this.escape(new Date(session.data_treino).toLocaleDateString("pt-BR")) + '</h2><div class="metric-grid"><div><span>Volume</span><strong>' + volume + '</strong></div><div><span>PSE</span><strong>' + this.escape(session.pse || "-") + '</strong></div><div><span>Exercícios</span><strong>' + session.total_exercicios + '</strong></div><div><span>Séries</span><strong>' + session.total_series + '</strong></div></div><h3>Exercícios realizados</h3>';
    Object.keys(byExercise).forEach(function (id) {
      var exercise = byExercise[id];
      html += '<section class="history-detail-exercise"><strong>' + App.escape(exercise.nome) + '</strong>';
      for (var j = 0; j < exercise.series.length; j++) {
        var row = exercise.series[j];
        var load = row.carga_absoluta === "" || row.carga_absoluta === undefined ? "-" : row.carga_absoluta + " kg";
        var reps = row.reps_executadas === "" || row.reps_executadas === undefined ? "-" : row.reps_executadas;
        html += '<p><span>Série ' + App.escape(row.serie || j + 1) + '</span><b>' + App.escape(load) + " × " + App.escape(reps) + ' (RIR: ' + App.escape(row.rir || "-") + ')</b></p>';
      }
      html += '</section>';
    });
    this.modal(html);
  },  loadProgress: function loadProgress(period) {
    var self = this;
    var root = document.getElementById("progresso-content");
    var buttons = document.querySelectorAll("[data-period]");
    for (var buttonIndex = 0; buttonIndex < buttons.length; buttonIndex++) buttons[buttonIndex].classList.toggle("selected", String(buttons[buttonIndex].getAttribute("data-period")) === String(period));
    this.call("getProgressData", { periodo: period }).then(function (data) {
      var list = data.e1rm_por_exercicio || [];
      var volume = Math.round(Number(data.volume_total || 0) / 100) / 10 + "k";
      root.innerHTML = '<div class="metric-grid"><div><span>Frequência</span><strong>' + App.escape(data.frequencia_semanal) + ' sessões/sem</strong></div><div><span>Volume total</span><strong>' + App.escape(volume) + '</strong></div></div><p class="muted">' + App.escape(data.sessoes) + ' sessões no período</p><h3>Evolução por exercício</h3>' + (list.length ? list.map(function (item) { var last = item.pontos[item.pontos.length - 1]; return '<div class="progress-line"><span>' + App.escape(item.nome_exercicio) + '</span><strong>' + Math.round(last.e1rm) + " kg</strong></div>"; }).join("") : '<p class="muted">O e1RM aparece quando houver carga, repetições e RIR entre 0 e 5.</p>');
    }).catch(function () { root.innerHTML = '<div class="empty-state">Não foi possível carregar o progresso agora.</div>'; });
  },  modal: function modal(html) { document.getElementById("modal-root").innerHTML = '<div class="modal-backdrop"><div class="modal-card"><button class="modal-close" type="button" onclick="App.closeModal()">×</button>' + html + "</div></div>"; },
  closeModal: function closeModal() { document.getElementById("modal-root").innerHTML = ""; },
  setSync: function setSync(text) { document.getElementById("sync-state").textContent = text; },
  toast: function toast(message) { var node = document.getElementById("toast"); node.textContent = message; node.classList.add("show"); setTimeout(function () { node.classList.remove("show"); }, 3500); },
  escape: function escape(value) { return String(value === undefined || value === null ? "" : value).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
};
document.addEventListener("DOMContentLoaded", function () { App.init(); });
</script>
