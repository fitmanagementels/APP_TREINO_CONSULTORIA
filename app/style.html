<style>
  /* =====================================================================
   XSTeam Wellness V2.0 — Dark Mode Absoluto | Single-Tenant
   Paleta: #000 (void) | #39FF14 (neon CTA) | #0D0D0D (cards)
   ===================================================================== */

  @import url("https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap");

  :root {
    --bg-void: #050806;
    --bg-card: rgba(16, 20, 17, 0.72);
    --bg-card-hover: rgba(25, 32, 27, 0.86);
    --bg-input: rgba(6, 10, 8, 0.78);
    --surface-gradient: linear-gradient(
      145deg,
      rgba(255, 255, 255, 0.075),
      rgba(255, 255, 255, 0.025) 42%,
      rgba(57, 255, 20, 0.035)
    );
    --surface-gradient-strong: linear-gradient(
      145deg,
      rgba(57, 255, 20, 0.13),
      rgba(255, 255, 255, 0.055) 42%,
      rgba(0, 213, 161, 0.045)
    );
    --app-background:
      radial-gradient(circle at 78% 8%, rgba(57, 255, 20, 0.11), transparent 30%),
      radial-gradient(circle at 8% 28%, rgba(0, 213, 161, 0.07), transparent 28%),
      linear-gradient(155deg, #08100b 0%, #050806 46%, #020302 100%);
    --brand-light-ray: linear-gradient(
      118deg,
      transparent 0%,
      rgba(57, 255, 20, 0.045) 36%,
      rgba(57, 255, 20, 0.105) 48%,
      rgba(0, 213, 161, 0.04) 58%,
      transparent 76%
    );
    --ambient-light:
      radial-gradient(ellipse at 86% 14%, rgba(57, 255, 20, 0.13), transparent 34%),
      radial-gradient(ellipse at 20% 88%, rgba(255, 184, 0, 0.035), transparent 26%),
      linear-gradient(180deg, rgba(255, 255, 255, 0.035), transparent 34%);
    --border-subtle: rgba(255, 255, 255, 0.105);
    --border-active: #39ff14;
    --neon: #39ff14;
    --neon-soft: #8cff7a;
    --neon-deep: #14b85a;
    --neon-dim: rgba(57, 255, 20, 0.14);
    --neon-glow: rgba(57, 255, 20, 0.26);
    --text-primary: #f4f7f2;
    --text-secondary: #b7c1b6;
    --text-muted: #737d72;
    --danger: #ff4444;
    --warning: #ffb800;
    --rpe-low: #39ff14;
    --rpe-mid: #ffb800;
    --rpe-high: #ff4444;
    --sync-pending: #ffb800;
    --sync-clean: #39ff14;
    --radius: 12px;
    --radius-sm: 8px;
    --shadow-soft: 0 12px 34px rgba(0, 0, 0, 0.28);
    --shadow-elevated: 0 22px 70px rgba(0, 0, 0, 0.48);
    --shadow-glow: 0 0 38px rgba(57, 255, 20, 0.14);
    --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    --nav-height: 72px;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  *,
  *::before,
  *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html,
  body {
    font-family:
      "Inter",
      -apple-system,
      sans-serif;
    background: var(--app-background);
    color: var(--text-primary);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
  }

  body {
    padding-bottom: calc(var(--nav-height) + var(--safe-bottom) + 16px);
    position: relative;
    isolation: isolate;
    overflow-x: hidden;
  }

  body::before,
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }

  body > * {
    position: relative;
    z-index: 1;
  }

  body::before {
    background: var(--brand-light-ray);
    opacity: 0.9;
    transform: skewY(-8deg) translateY(-8%);
    filter: blur(1px);
  }

  body::after {
    background: var(--ambient-light);
    mix-blend-mode: screen;
    opacity: 0.72;
  }

  body[data-screen="treino"] {
    --brand-light-ray: linear-gradient(
      118deg,
      transparent 0%,
      rgba(57, 255, 20, 0.05) 34%,
      rgba(57, 255, 20, 0.125) 48%,
      rgba(0, 213, 161, 0.045) 58%,
      transparent 76%
    );
    --ambient-light:
      radial-gradient(ellipse at 86% 14%, rgba(57, 255, 20, 0.15), transparent 34%),
      radial-gradient(ellipse at 18% 88%, rgba(255, 184, 0, 0.035), transparent 26%),
      linear-gradient(180deg, rgba(255, 255, 255, 0.035), transparent 34%);
  }

  body[data-screen="prescricao"] {
    --brand-light-ray: linear-gradient(
      96deg,
      transparent 0%,
      rgba(139, 255, 122, 0.035) 30%,
      rgba(0, 213, 161, 0.09) 48%,
      rgba(57, 255, 20, 0.035) 63%,
      transparent 78%
    );
    --ambient-light:
      radial-gradient(ellipse at 72% 18%, rgba(0, 213, 161, 0.115), transparent 32%),
      radial-gradient(ellipse at 12% 76%, rgba(57, 255, 20, 0.055), transparent 30%),
      linear-gradient(180deg, rgba(255, 255, 255, 0.028), transparent 38%);
  }

  body[data-screen="prescrever"] {
    --brand-light-ray: linear-gradient(
      132deg,
      transparent 0%,
      rgba(57, 255, 20, 0.038) 28%,
      rgba(255, 184, 0, 0.095) 49%,
      rgba(57, 255, 20, 0.052) 62%,
      transparent 80%
    );
    --ambient-light:
      radial-gradient(ellipse at 82% 22%, rgba(255, 184, 0, 0.105), transparent 30%),
      radial-gradient(ellipse at 18% 82%, rgba(57, 255, 20, 0.07), transparent 30%),
      linear-gradient(180deg, rgba(255, 255, 255, 0.032), transparent 34%);
  }

  body[data-screen="historico"] {
    --brand-light-ray: linear-gradient(
      64deg,
      transparent 0%,
      rgba(57, 255, 20, 0.025) 32%,
      rgba(139, 255, 122, 0.07) 52%,
      rgba(255, 255, 255, 0.018) 66%,
      transparent 82%
    );
    --ambient-light:
      radial-gradient(ellipse at 18% 74%, rgba(57, 255, 20, 0.085), transparent 32%),
      radial-gradient(ellipse at 88% 18%, rgba(255, 255, 255, 0.045), transparent 24%),
      linear-gradient(180deg, rgba(255, 255, 255, 0.022), transparent 44%);
  }

  body[data-screen="carga"] {
    --brand-light-ray: linear-gradient(
      108deg,
      transparent 0%,
      rgba(57, 255, 20, 0.038) 32%,
      rgba(0, 213, 161, 0.11) 50%,
      rgba(89, 199, 255, 0.055) 62%,
      transparent 80%
    );
    --ambient-light:
      radial-gradient(ellipse at 80% 16%, rgba(0, 213, 161, 0.12), transparent 32%),
      radial-gradient(ellipse at 16% 82%, rgba(89, 199, 255, 0.07), transparent 28%),
      linear-gradient(180deg, rgba(255, 255, 255, 0.03), transparent 36%);
  }

  ::-webkit-scrollbar {
    width: 4px;
  }
  ::-webkit-scrollbar-track {
    background: transparent;
  }
  ::-webkit-scrollbar-thumb {
    background: var(--border-subtle);
    border-radius: 4px;
  }

  /* ── GLOBAL LOADER ── */
  .global-loader {
    position: fixed;
    inset: 0;
    background: var(--app-background);
    z-index: 9999;
    display: flex;
    align-items: center;
    justify-content: center;
    transition:
      opacity 0.5s ease,
      visibility 0.5s ease;
  }
  .global-loader.hidden {
    opacity: 0;
    visibility: hidden;
  }
  .loader-content {
    text-align: center;
  }
  .spinner {
    width: 40px;
    height: 40px;
    border: 3px solid rgba(57, 255, 20, 0.18);
    border-top-color: var(--neon);
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin: 0 auto 16px;
    box-shadow: var(--shadow-glow);
  }
  @keyframes spin {
    to {
      transform: rotate(360deg);
    }
  }
  .loader-text {
    color: var(--neon-soft);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  /* ── GOOGLE LOGIN ── */
  .google-login-overlay {
    position: fixed;
    inset: 0;
    z-index: 11000;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background:
      radial-gradient(circle at 78% 12%, rgba(57, 255, 20, 0.14), transparent 32%),
      linear-gradient(155deg, rgba(4, 9, 6, 0.97), rgba(1, 2, 1, 0.985));
  }
  .google-login-overlay.show {
    display: flex;
  }
  .google-login-card {
    width: min(100%, 380px);
    padding: 34px 28px 30px;
    text-align: center;
    border: 1px solid rgba(57, 255, 20, 0.34);
    border-radius: 20px;
    background: var(--surface-gradient);
    box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.04) inset, var(--shadow-elevated), var(--shadow-glow);
  }
  .google-login-mark {
    width: 54px;
    height: 54px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 18px;
    border-radius: 16px;
    background: var(--neon);
    color: #041005;
    font-size: 28px;
    font-weight: 900;
    box-shadow: 0 0 28px rgba(57, 255, 20, 0.35);
  }
  .google-login-eyebrow {
    margin-bottom: 8px;
    color: var(--neon-soft);
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 1.7px;
  }
  .google-login-card h1 {
    margin: 0;
    color: var(--text-primary);
    font-size: 24px;
  }
  .google-login-copy {
    margin: 12px auto 22px;
    color: var(--text-secondary);
    font-size: 13px;
    line-height: 1.55;
  }
  .google-login-button {
    display: flex;
    justify-content: center;
    min-height: 44px;
  }
  .google-login-message {
    min-height: 18px;
    margin: 18px 0 0;
    color: var(--text-muted);
    font-size: 12px;
    line-height: 1.4;
  }
  .google-login-message.error {
    color: #ff9f9f;
  }

  /* ── HEADER ── */
  .app-header {
    position: sticky;
    top: 0;
    z-index: 100;
    padding: 16px 20px 12px;
    background: linear-gradient(180deg, rgba(5, 8, 6, 0.94) 58%, rgba(5, 8, 6, 0));
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
  }
  .app-header h1 {
    font-size: 20px;
    font-weight: 800;
    letter-spacing: -0.5px;
    background: linear-gradient(135deg, var(--neon), var(--neon-soft));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .app-header .subtitle {
    font-size: 11px;
    color: var(--text-muted);
    font-weight: 400;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-top: 2px;
  }

  /* ── SYNC BADGE ── */
  .sync-badge {
    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 200;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
    background: var(--surface-gradient), var(--bg-card);
    border: 1px solid var(--border-subtle);
    box-shadow: var(--shadow-soft);
    cursor: pointer;
    transition: var(--transition);
  }
  .sync-badge:hover {
    border-color: rgba(57, 255, 20, 0.46);
    box-shadow: var(--shadow-soft), var(--shadow-glow);
  }
  .sync-badge .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--sync-clean);
  }
  .sync-badge .dot.pending {
    background: var(--sync-pending);
    animation: pulse-dot 1.5s infinite;
  }
  @keyframes pulse-dot {
    0%,
    100% {
      opacity: 1;
      transform: scale(1);
    }
    50% {
      opacity: 0.5;
      transform: scale(1.3);
    }
  }

  /* ── SCREEN ── */
  .screen {
    display: none;
    padding: 0 16px 24px;
    animation: fadeIn 0.3s ease;
  }
  .screen.active {
    display: block;
  }
  @keyframes fadeIn {
    from {
      opacity: 0;
      transform: translateY(8px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  /* ── SECTION ── */
  .section-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin: 24px 0 12px;
    padding-left: 4px;
  }
  .section-title-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin: 24px 0 12px;
  }
  .section-title-row .section-title {
    margin: 0;
  }
  .section-action {
    width: auto;
    min-height: 40px;
    padding: 10px 12px;
    color: var(--neon-soft);
    border-color: var(--neon-dim);
    white-space: nowrap;
  }

  /* ── EXERCISE CARD ── */
  .exercise-card {
    background: var(--surface-gradient), var(--bg-card);
    border: 1px solid var(--border-subtle);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 16px;
    transition: var(--transition);
    position: relative;
    overflow: hidden;
    box-shadow: var(--shadow-soft);
  }
  .exercise-card::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 3px;
    background: linear-gradient(180deg, var(--neon), var(--neon-soft), var(--neon-deep));
    border-radius: 0 3px 3px 0;
    opacity: 0;
    transition: var(--transition);
  }
  .exercise-card.active::before {
    opacity: 1;
    box-shadow: 0 0 22px var(--neon-glow);
  }
  .exercise-card.completed {
    opacity: 0.5;
  }
  .exercise-card.completed::before {
    background: var(--text-muted);
    opacity: 1;
  }
  .exercise-card .ex-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 16px;
    gap: 12px;
  }
  .ex-title-toggle {
    display: block;
    flex: 1;
    min-width: 0;
    padding: 0;
    border: none;
    background: transparent;
    color: var(--text-primary);
    text-align: left;
    font-family: "Inter", sans-serif;
    cursor: pointer;
  }
  .treino-card-actions {
    display: flex;
    gap: 6px;
    flex-shrink: 0;
  }
  .treino-card-actions .btn-icon {
    width: 38px;
    height: 38px;
  }
  .exercise-card .ex-order {
    font-size: 11px;
    font-weight: 700;
    color: var(--neon);
    background: linear-gradient(135deg, rgba(57, 255, 20, 0.18), rgba(0, 213, 161, 0.08));
    border: 1px solid rgba(57, 255, 20, 0.18);
    padding: 3px 8px;
    border-radius: 6px;
  }
  .exercise-card .ex-name {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: -0.3px;
    margin-top: 8px;
  }
  .exercise-card .ex-meta {
    display: flex;
    gap: 16px;
    margin-bottom: 16px;
  }
  .exercise-card .meta-item {
    text-align: center;
  }
  .exercise-card .meta-label {
    font-size: 10px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 4px;
  }
  .exercise-card .meta-value {
    font-size: 18px;
    font-weight: 700;
    color: var(--neon);
  }
  .ex-obs {
    font-size: 11px;
    font-style: italic;
    color: var(--text-muted);
    margin-top: 4px;
    line-height: 1.4;
  }
  .treino-day-add {
    margin-top: 6px;
    border-color: rgba(57, 255, 20, 0.22);
    color: var(--text-secondary);
  }

  /* ── INPUT GRID ── */
  .input-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .input-group {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .input-group label {
    font-size: 10px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: 600;
  }
  .input-group input,
  .input-group select {
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.035), rgba(255, 255, 255, 0.01)), var(--bg-input);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-sm);
    padding: 12px 14px;
    color: var(--text-primary);
    font-size: 16px;
    font-weight: 600;
    font-family: "Inter", sans-serif;
    transition: var(--transition);
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
  }
  .input-group input:focus,
  .input-group select:focus {
    outline: none;
    border-color: rgba(57, 255, 20, 0.72);
    box-shadow: 0 0 0 3px var(--neon-dim), var(--shadow-glow);
  }
  .input-group input::placeholder {
    color: var(--text-muted);
  }

  /* ── SET ROWS & COLLAPSE ── */
  .set-row {
    transition: var(--transition);
  }
  .set-row input {
    padding: 10px !important;
    font-size: 14px !important;
    text-align: center;
  }
  .collapse-icon {
    font-size: 12px;
    color: var(--text-muted);
    transition: transform 0.3s ease;
  }
  .ex-body-wrapper {
    overflow: hidden;
    opacity: 1;
    transform: translateY(0);
    transition:
      opacity 0.16s ease-out,
      transform 0.16s ease-out;
    will-change: opacity, transform;
  }
  .ex-body-wrapper.collapsed {
    height: 0;
    opacity: 0;
    pointer-events: none;
    transform: translateY(-4px);
  }
  .ex-body-inner {
    overflow: visible;
    transform: translateZ(0) scaleY(1);
    transform-origin: top;
    transition:
      opacity 0.2s ease-out,
      transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
    will-change: opacity, transform;
  }
  .ex-body-wrapper.collapsed .ex-body-inner {
    opacity: 0;
    transform: translateY(-6px) scaleY(0.98);
  }

  /* ── BUTTONS ── */
  .btn-neon {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: var(--radius);
    background: linear-gradient(135deg, var(--neon), var(--neon-soft), #00d5a1);
    color: #041005;
    font-size: 14px;
    font-weight: 700;
    font-family: "Inter", sans-serif;
    cursor: pointer;
    transition: var(--transition);
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .btn-neon:hover {
    box-shadow: 0 16px 36px rgba(57, 255, 20, 0.18), 0 0 24px var(--neon-glow);
    transform: translateY(-1px);
  }
  .btn-neon:active {
    transform: translateY(0);
  }
  .btn-neon:disabled {
    opacity: 0.4;
    pointer-events: none;
  }

  .btn-ghost {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 12px;
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius);
    background: rgba(255, 255, 255, 0.018);
    color: var(--text-secondary);
    font-size: 13px;
    font-weight: 600;
    font-family: "Inter", sans-serif;
    cursor: pointer;
    transition: var(--transition);
  }
  .btn-ghost:hover {
    border-color: rgba(57, 255, 20, 0.46);
    color: var(--neon-soft);
    background: rgba(57, 255, 20, 0.055);
  }

  /* ── WEEK SELECTOR ── */
  .week-selector {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
  }

  .training-panel-hidden {
    display: none !important;
  }

  .training-mode-selector {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 16px;
  }

  .training-mode-selector .week-btn {
    min-height: 44px;
  }

  .training-prescribed-context {
    display: grid;
    grid-template-columns: minmax(0, 34fr) minmax(0, 42fr) minmax(0, 24fr);
    gap: 8px;
    margin-bottom: 14px;
  }

  .training-select-field {
    position: relative;
    min-width: 0;
  }

  .training-select-field label {
    display: block;
    margin: 0 0 6px;
    color: var(--neon);
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.7px;
    text-transform: uppercase;
  }

  .training-select-trigger {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    width: 100%;
    min-width: 0;
    min-height: 48px;
    padding: 0 10px;
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-sm);
    appearance: none;
    background: rgba(255, 255, 255, 0.018);
    color: var(--text-primary);
    font-family: "Inter", sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: var(--transition);
  }

  .training-select-trigger > span:first-child {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .training-select-trigger > span:last-child {
    flex: 0 0 auto;
    color: var(--neon-soft);
    font-size: 14px;
    transition: transform 0.2s ease;
  }

  .training-select-trigger[aria-expanded="true"] {
    border-color: rgba(57, 255, 20, 0.58);
    background: rgba(57, 255, 20, 0.06);
    box-shadow: inset 0 0 18px rgba(57, 255, 20, 0.04);
  }

  .training-select-trigger[aria-expanded="true"] > span:last-child {
    transform: rotate(180deg);
  }

  .training-select-trigger:focus-visible {
    outline: 2px solid var(--neon);
    outline-offset: 2px;
  }

  .training-select-trigger:disabled {
    cursor: not-allowed;
    opacity: 0.45;
  }

  .training-select-menu {
    position: absolute;
    z-index: 80;
    top: calc(100% + 6px);
    left: 0;
    width: max-content;
    min-width: 100%;
    max-width: calc(100vw - 32px);
    max-height: 240px;
    padding: 5px;
    overflow-y: auto;
    border: 1px solid rgba(255, 255, 255, 0.13);
    border-radius: var(--radius-sm);
    background: #101610;
    box-shadow: 0 18px 40px rgba(0, 0, 0, 0.48);
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transform: translateY(-5px);
    transition: opacity 0.2s ease, transform 0.2s ease;
  }

  .training-select-menu--right {
    right: 0;
    left: auto;
  }

  .training-select-menu.show {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
    transform: translateY(0);
  }

  .training-select-option {
    display: flex;
    align-items: center;
    width: 100%;
    min-height: 42px;
    padding: 9px 11px;
    border: 1px solid transparent;
    border-radius: 8px;
    background: transparent;
    color: var(--text-secondary);
    font-family: "Inter", sans-serif;
    font-size: 12px;
    font-weight: 600;
    text-align: left;
    white-space: nowrap;
    cursor: pointer;
  }

  .training-select-option:hover,
  .training-select-option:focus-visible {
    background: rgba(255, 255, 255, 0.045);
    color: var(--text-primary);
    outline: none;
  }

  .training-select-option.active {
    border-color: rgba(57, 255, 20, 0.34);
    background: rgba(57, 255, 20, 0.09);
    color: var(--neon-soft);
  }

  .training-select-empty {
    padding: 12px;
    color: var(--text-muted);
    font-size: 11px;
    white-space: nowrap;
  }

  .training-native-control {
    position: absolute !important;
    width: 1px !important;
    height: 1px !important;
    overflow: hidden !important;
    clip: rect(0 0 0 0) !important;
    pointer-events: none !important;
  }

  .training-date-navigator {
    display: grid;
    grid-template-columns: 46px minmax(0, 1fr) 46px;
    min-height: 58px;
    margin-bottom: 18px;
    overflow: hidden;
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-sm);
    background: rgba(255, 255, 255, 0.018);
  }

  .training-date-navigator button {
    border: 0;
    background: transparent;
    color: var(--text-secondary);
    font-family: "Inter", sans-serif;
    cursor: pointer;
  }

  #training-date-previous,
  #training-date-next {
    color: var(--neon-soft);
    font-size: 28px;
  }

  #training-date-open {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-width: 0;
    border-right: 1px solid rgba(255, 255, 255, 0.055);
    border-left: 1px solid rgba(255, 255, 255, 0.055);
  }

  #training-date-weekday {
    color: var(--text-primary);
    font-size: 12px;
    font-weight: 700;
    text-transform: capitalize;
  }

  #training-date-label {
    margin-top: 3px;
    overflow: hidden;
    color: var(--text-muted);
    font-size: 10px;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .training-date-navigator button:hover {
    background: rgba(57, 255, 20, 0.045);
    color: var(--neon);
  }

  .training-date-navigator button:focus-visible {
    position: relative;
    z-index: 1;
    outline: 2px solid var(--neon);
    outline-offset: -2px;
  }

  .training-calendar-overlay {
    position: fixed;
    z-index: 3000;
    inset: 0;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding: 14px;
    background: rgba(0, 0, 0, 0.72);
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity 0.2s ease, visibility 0.2s ease;
  }

  .training-calendar-overlay.show {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
  }

  .training-calendar-panel {
    width: 100%;
    max-width: 420px;
    padding: 16px 14px calc(16px + env(safe-area-inset-bottom));
    border: 1px solid rgba(57, 255, 20, 0.2);
    border-radius: 18px;
    background: #0d130d;
    box-shadow: 0 24px 70px rgba(0, 0, 0, 0.62);
    transform: translateY(18px);
    transition: transform 0.2s ease;
  }

  .training-calendar-overlay.show .training-calendar-panel {
    transform: translateY(0);
  }

  .training-calendar-header {
    display: grid;
    grid-template-columns: 44px minmax(0, 1fr) 44px;
    align-items: center;
    margin-bottom: 12px;
  }

  .training-calendar-header h2 {
    margin: 0;
    color: var(--text-primary);
    font-size: 14px;
    font-weight: 700;
    text-align: center;
    text-transform: capitalize;
  }

  .training-calendar-header button {
    min-width: 44px;
    min-height: 44px;
    border: 1px solid var(--border-subtle);
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.018);
    color: var(--neon-soft);
    font-family: "Inter", sans-serif;
    font-size: 26px;
    cursor: pointer;
  }

  .training-calendar-weekdays,
  .training-calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    gap: 4px;
  }

  .training-calendar-weekdays {
    margin-bottom: 4px;
  }

  .training-calendar-weekdays span {
    padding: 5px 0;
    color: var(--text-muted);
    font-size: 9px;
    font-weight: 700;
    text-align: center;
    text-transform: uppercase;
  }

  .training-calendar-day {
    position: relative;
    min-width: 0;
    min-height: 42px;
    border: 1px solid transparent;
    border-radius: 9px;
    background: transparent;
    color: var(--text-secondary);
    font-family: "Inter", sans-serif;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }

  .training-calendar-day:hover,
  .training-calendar-day:focus-visible {
    border-color: rgba(57, 255, 20, 0.32);
    background: rgba(57, 255, 20, 0.055);
    color: var(--text-primary);
    outline: none;
  }

  .training-calendar-day.is-outside {
    color: rgba(255, 255, 255, 0.22);
  }

  .training-calendar-day.is-today::after {
    position: absolute;
    right: 50%;
    bottom: 5px;
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: var(--neon);
    content: "";
    transform: translateX(50%);
  }

  .training-calendar-day.is-selected {
    border-color: rgba(57, 255, 20, 0.72);
    background: rgba(57, 255, 20, 0.15);
    color: var(--neon-soft);
    box-shadow: inset 0 0 16px rgba(57, 255, 20, 0.05);
  }

  .training-calendar-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 14px;
  }

  .training-calendar-actions .btn-ghost {
    margin: 0;
  }

  @media (min-width: 600px) {
    .training-calendar-overlay {
      align-items: center;
    }
  }

  #treino-active-summary {
    margin-bottom: 16px;
  }

  .training-session-actions {
    display: grid;
    gap: 8px;
    margin-top: 12px;
  }

  .training-cancel-btn {
    color: var(--danger);
  }

  .training-sync-state {
    margin-top: 8px;
    color: var(--text-muted);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
  }

  .set-row.training-set-incomplete {
    padding: 6px;
    border: 1px solid rgba(255, 68, 68, 0.58);
    border-radius: var(--radius-sm);
    background: rgba(255, 68, 68, 0.06);
  }

  .week-btn {
    flex: 1;
    padding: 10px;
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-sm);
    background: rgba(255, 255, 255, 0.018);
    color: var(--text-secondary);
    font-size: 12px;
    font-weight: 600;
    font-family: "Inter", sans-serif;
    cursor: pointer;
    transition: var(--transition);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .week-btn.active {
    background: linear-gradient(135deg, rgba(57, 255, 20, 0.16), rgba(0, 213, 161, 0.075));
    border-color: rgba(57, 255, 20, 0.58);
    color: var(--neon-soft);
    box-shadow: inset 0 0 18px rgba(57, 255, 20, 0.06), var(--shadow-glow);
  }

  /* ── PRESCRIPTION ROW ── */
  .rx-header {
    display: grid;
    grid-template-columns: 36px 1fr 50px 60px 50px;
    gap: 8px;
    padding: 8px 16px;
    margin-bottom: 4px;
  }
  .rx-header span {
    font-size: 10px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    text-align: center;
    font-weight: 600;
  }
  .rx-header span:nth-child(2) {
    text-align: left;
  }
  .rx-row {
    display: grid;
    grid-template-columns: 36px 1fr 50px 60px 50px;
    align-items: center;
    gap: 8px;
    padding: 14px 16px;
    background: var(--surface-gradient), var(--bg-card);
    border: 1px solid var(--border-subtle);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-radius: var(--radius-sm);
    margin-bottom: 8px;
    transition: var(--transition);
  }
  .rx-row:hover {
    border-color: rgba(57, 255, 20, 0.24);
    background: var(--surface-gradient-strong), var(--bg-card-hover);
  }
  .rx-order {
    font-size: 12px;
    font-weight: 800;
    color: var(--neon);
    text-align: center;
  }
  .rx-name {
    font-size: 14px;
    font-weight: 600;
  }
  .rx-val {
    text-align: center;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-secondary);
  }
  .rx-val.sets {
    color: var(--neon);
  }
  .rx-obs {
    font-size: 10px;
    font-style: italic;
    color: var(--text-muted);
    margin-top: 2px;
    grid-column: 2 / -1;
  }

  .rx-treino-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px;
    background: linear-gradient(135deg, rgba(57, 255, 20, 0.09), rgba(255, 255, 255, 0.035));
    border: 1px solid rgba(57, 255, 20, 0.2);
    border-radius: var(--radius);
    margin-top: 16px;
    cursor: pointer;
    color: var(--neon);
    font-weight: 700;
    font-size: 14px;
    transition: var(--transition);
    margin-bottom: 8px;
  }
  .rx-treino-header:hover {
    background: linear-gradient(135deg, rgba(57, 255, 20, 0.14), rgba(0, 213, 161, 0.055));
  }
  .rx-body-wrapper {
    overflow: hidden;
    opacity: 1;
    transform: translateY(0);
    transition:
      opacity 0.16s ease-out,
      transform 0.16s ease-out;
    will-change: opacity, transform;
  }
  .rx-body-wrapper.collapsed {
    height: 0;
    opacity: 0;
    pointer-events: none;
    transform: translateY(-4px);
  }
  .rx-body-inner {
    overflow: visible;
    transform: translateZ(0) scaleY(1);
    transform-origin: top;
    transition:
      opacity 0.2s ease-out,
      transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
    will-change: opacity, transform;
  }
  .rx-body-wrapper.collapsed .rx-body-inner {
    opacity: 0;
    transform: translateY(-6px) scaleY(0.98);
  }

  @media (prefers-reduced-motion: reduce) {
    .ex-body-wrapper,
    .rx-body-wrapper,
    .ex-body-inner,
    .rx-body-inner,
    .collapse-icon {
      transition: none;
    }
  }

  /* ── PRESCREVER EDITOR ── */
  .prescrever-toolbar,
  .prescrever-filters {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 14px;
  }
  .prescrever-toolbar .btn-neon {
    grid-column: auto;
  }
  .catalog-sync-status {
    grid-column: 1 / -1;
    color: var(--text-muted);
    font-size: 11px;
    line-height: 1.35;
    min-height: 15px;
  }
  .catalog-sync-status.error {
    color: var(--danger);
  }
  .prescrever-filters {
    grid-template-columns: 1.4fr 1fr;
  }
  .prescrever-card,
  .catalog-row,
  .demand-card {
    background: var(--surface-gradient);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius);
    box-shadow: var(--shadow-soft);
  }
  .prescrever-card {
    padding: 14px;
    margin-bottom: 12px;
  }
  .prescrever-card-head,
  .catalog-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .prescrever-card-actions {
    display: flex;
    gap: 6px;
    flex-shrink: 0;
  }
  .exercise-select {
    display: block;
    width: 100%;
    max-width: 280px;
    margin-top: 8px;
    padding: 0;
    border: none;
    background: transparent;
    color: var(--text-primary);
    text-align: left;
    font-family: "Inter", sans-serif;
    cursor: pointer;
  }
  .exercise-select::after {
    content: "▾";
    display: inline-block;
    margin-left: 6px;
    color: var(--neon-soft);
    font-size: 11px;
  }
  .btn-icon {
    width: 34px;
    height: 34px;
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-sm);
    background: rgba(0, 0, 0, 0.22);
    color: var(--text-secondary);
    font-size: 15px;
    font-weight: 800;
    cursor: pointer;
  }
  .btn-icon.danger {
    color: var(--danger);
  }
  .cycle-grid {
    display: grid;
    grid-template-columns: 64px 1fr 1fr 1fr;
    gap: 6px;
    margin-top: 12px;
    align-items: center;
    font-size: 10px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .cycle-grid input {
    width: 100%;
    min-width: 0;
    padding: 9px 6px;
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-sm);
    background: var(--bg-input);
    color: var(--text-primary);
    font-size: 13px;
    font-weight: 700;
    text-align: center;
  }
  .cycle-label {
    color: var(--neon-soft);
    font-weight: 800;
  }
  .catalog-row {
    padding: 12px;
    margin-bottom: 8px;
  }
  .catalog-name {
    font-size: 13px;
    font-weight: 800;
    color: var(--text-primary);
  }
  .catalog-meta {
    margin-top: 3px;
    font-size: 10px;
    color: var(--text-muted);
  }
  .catalog-add {
    width: auto;
    padding: 8px 10px;
    flex-shrink: 0;
  }
  .prescrever-catalog-modal {
    width: min(92vw, 460px);
    max-height: 82vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    padding: 18px;
    background: rgba(12, 18, 14, 0.96);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius);
    box-shadow: var(--shadow-elevated);
  }
  .prescrever-demand-modal {
    width: min(94vw, 520px);
    max-height: 84vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    padding: 18px;
    background: rgba(12, 18, 14, 0.96);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius);
    box-shadow: var(--shadow-elevated);
  }
  .modal-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 14px;
  }
  .modal-head h2 {
    margin: 0;
    font-size: 16px;
    color: var(--neon-soft);
  }
  .modal-head button {
    width: 38px;
    height: 38px;
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-sm);
    background: rgba(0, 0, 0, 0.22);
    color: var(--text-secondary);
    font-size: 24px;
    line-height: 1;
    cursor: pointer;
  }
  #prescrever-catalog-list {
    overflow-y: auto;
    padding-right: 2px;
  }
  .demand-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin: 12px 0 4px;
  }
  .demand-card {
    padding: 12px;
    cursor: pointer;
    transition: var(--transition);
  }
  .demand-card:hover {
    border-color: var(--neon-dim);
    transform: translateY(-1px);
  }
  .demand-title {
    color: var(--neon-soft);
    font-size: 11px;
    font-weight: 800;
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  .demand-row {
    display: grid;
    grid-template-columns: 74px 1fr 34px;
    gap: 6px;
    align-items: center;
    margin-bottom: 7px;
    font-size: 10px;
    color: var(--text-secondary);
  }
  .demand-bar {
    height: 5px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.08);
    overflow: hidden;
  }
  .demand-bar i {
    display: block;
    height: 100%;
    border-radius: inherit;
    background: linear-gradient(90deg, var(--neon), var(--neon-soft));
  }
  .demand-row strong {
    color: var(--text-primary);
    text-align: right;
  }
  .empty-mini {
    color: var(--text-muted);
    font-size: 11px;
  }
  #prescrever-demand-table {
    overflow-y: auto;
    max-height: 34vh;
    padding-right: 2px;
    margin-bottom: 12px;
  }
  .demand-table-head,
  .demand-table-row {
    display: grid;
    grid-template-columns: 1fr 72px;
    gap: 10px;
    align-items: center;
  }
  .demand-table-head {
    padding: 0 10px 8px;
    color: var(--text-muted);
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.8px;
  }
  .demand-table-row {
    width: 100%;
    min-height: 42px;
    margin-bottom: 6px;
    padding: 9px 10px;
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-sm);
    background: rgba(0, 0, 0, 0.18);
    color: var(--text-secondary);
    font: inherit;
    text-align: left;
    cursor: pointer;
  }
  .demand-table-row.active {
    border-color: var(--neon);
    color: var(--text-primary);
    background: rgba(57, 255, 20, 0.08);
  }
  .demand-table-row strong {
    color: var(--neon-soft);
    text-align: right;
  }
  #prescrever-demand-detail {
    border-top: 1px solid var(--border-subtle);
    padding-top: 12px;
    overflow-y: auto;
  }
  .demand-detail-title {
    color: var(--neon-soft);
    font-size: 12px;
    font-weight: 800;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .demand-source-row {
    display: grid;
    grid-template-columns: 1fr 48px 48px 56px;
    gap: 8px;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid var(--border-subtle);
  }
  .demand-source-row strong,
  .demand-source-row b,
  .demand-source-row span,
  .demand-source-row small {
    display: block;
  }
  .demand-source-row strong {
    font-size: 12px;
    color: var(--text-primary);
  }
  .demand-source-row span,
  .demand-source-row small {
    font-size: 9px;
    color: var(--text-muted);
    text-transform: uppercase;
  }
  .demand-source-row b {
    color: var(--neon-soft);
    font-size: 13px;
    text-align: right;
  }
  .demand-source-row small {
    text-align: right;
  }

  /* ── KPI CARDS ── */
  .kpi-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 20px;
  }
  .kpi-card {
    background: var(--surface-gradient), var(--bg-card);
    border: 1px solid var(--border-subtle);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-radius: var(--radius);
    padding: 16px;
    text-align: center;
    transition: var(--transition);
    box-shadow: var(--shadow-soft);
  }
  .kpi-card:hover {
    border-color: rgba(57, 255, 20, 0.28);
    transform: translateY(-2px);
    box-shadow: var(--shadow-elevated), var(--shadow-glow);
  }
  .kpi-card .kpi-value {
    font-size: 26px;
    font-weight: 800;
    color: var(--neon-soft);
    letter-spacing: -1px;
  }
  .kpi-card .kpi-label {
    font-size: 10px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-top: 4px;
  }
  .kpi-card .kpi-sub {
    font-size: 11px;
    color: var(--text-secondary);
    margin-top: 2px;
  }

  /* ── SVG CHART CONTAINER ── */
  .chart-container {
    background: var(--surface-gradient), var(--bg-card);
    border: 1px solid var(--border-subtle);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 16px;
    overflow: hidden;
    box-shadow: var(--shadow-soft);
  }
  .chart-container .chart-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 16px;
  }
  .chart-container svg {
    width: 100%;
    height: auto;
    display: block;
  }
  .chart-container svg text {
    fill: var(--text-muted);
    font-family: "Inter", sans-serif;
    font-size: 10px;
  }
  .chart-container svg .axis-line {
    stroke: var(--border-subtle);
