<style>
  /* =====================================================================
   XSTeam Wellness V2.0 — Dark Mode Absoluto | Single-Tenant
   Paleta: #000 (void) | #39FF14 (neon CTA) | #0D0D0D (cards)
   ===================================================================== */

  @import url("https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap");

  :root {
    --bg-void: #0a0a0a;
    --bg-card: rgba(20, 20, 20, 0.65);
    --bg-card-hover: rgba(30, 30, 30, 0.8);
    --bg-input: rgba(10, 10, 10, 0.8);
    --border-subtle: rgba(255, 255, 255, 0.08);
    --border-active: #39ff14;
    --neon: #39ff14;
    --neon-dim: rgba(57, 255, 20, 0.15);
    --neon-glow: rgba(57, 255, 20, 0.4);
    --text-primary: #f0f0f0;
    --text-secondary: #888888;
    --text-muted: #555555;
    --danger: #ff4444;
    --warning: #ffb800;
    --rpe-low: #39ff14;
    --rpe-mid: #ffb800;
    --rpe-high: #ff4444;
    --sync-pending: #ffb800;
    --sync-clean: #39ff14;
    --radius: 12px;
    --radius-sm: 8px;
    --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    --nav-height: 72px;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  *,
  *::before,
  *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html,
  body {
    font-family:
      "Inter",
      -apple-system,
      sans-serif;
    background: var(--bg-void);
    color: var(--text-primary);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
  }

  body {
    padding-bottom: calc(var(--nav-height) + var(--safe-bottom) + 16px);
  }

  ::-webkit-scrollbar {
    width: 4px;
  }
  ::-webkit-scrollbar-track {
    background: transparent;
  }
  ::-webkit-scrollbar-thumb {
    background: var(--border-subtle);
    border-radius: 4px;
  }

  /* ── GLOBAL LOADER ── */
  .global-loader {
    position: fixed;
    inset: 0;
    background: var(--bg-void);
    z-index: 9999;
    display: flex;
    align-items: center;
    justify-content: center;
    transition:
      opacity 0.5s ease,
      visibility 0.5s ease;
  }
  .global-loader.hidden {
    opacity: 0;
    visibility: hidden;
  }
  .loader-content {
    text-align: center;
  }
  .spinner {
    width: 40px;
    height: 40px;
    border: 3px solid rgba(57, 255, 20, 0.2);
    border-top-color: var(--neon);
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin: 0 auto 16px;
  }
  @keyframes spin {
    to {
      transform: rotate(360deg);
    }
  }
  .loader-text {
    color: var(--neon);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  /* ── HEADER ── */
  .app-header {
    position: sticky;
    top: 0;
    z-index: 100;
    padding: 16px 20px 12px;
    background: linear-gradient(180deg, #0a0a0a 60%, transparent);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
  }
  .app-header h1 {
    font-size: 20px;
    font-weight: 800;
    letter-spacing: -0.5px;
    background: linear-gradient(135deg, var(--neon), #00ff88);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .app-header .subtitle {
    font-size: 11px;
    color: var(--text-muted);
    font-weight: 400;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-top: 2px;
  }

  /* ── SYNC BADGE ── */
  .sync-badge {
    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 200;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    cursor: pointer;
    transition: var(--transition);
  }
  .sync-badge:hover {
    border-color: var(--neon);
  }
  .sync-badge .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--sync-clean);
  }
  .sync-badge .dot.pending {
    background: var(--sync-pending);
    animation: pulse-dot 1.5s infinite;
  }
  @keyframes pulse-dot {
    0%,
    100% {
      opacity: 1;
      transform: scale(1);
    }
    50% {
      opacity: 0.5;
      transform: scale(1.3);
    }
  }

  /* ── SCREEN ── */
  .screen {
    display: none;
    padding: 0 16px 24px;
    animation: fadeIn 0.3s ease;
  }
  .screen.active {
    display: block;
  }
  @keyframes fadeIn {
    from {
      opacity: 0;
      transform: translateY(8px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  /* ── SECTION ── */
  .section-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin: 24px 0 12px;
    padding-left: 4px;
  }

  /* ── EXERCISE CARD ── */
  .exercise-card {
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 16px;
    transition: var(--transition);
    position: relative;
    overflow: hidden;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
  }
  .exercise-card::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 3px;
    background: var(--neon);
    border-radius: 0 3px 3px 0;
    opacity: 0;
    transition: var(--transition);
  }
  .exercise-card.active::before {
    opacity: 1;
  }
  .exercise-card.completed {
    opacity: 0.5;
  }
  .exercise-card.completed::before {
    background: var(--text-muted);
    opacity: 1;
  }
  .exercise-card .ex-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 16px;
  }
  .exercise-card .ex-order {
    font-size: 11px;
    font-weight: 700;
    color: var(--neon);
    background: var(--neon-dim);
    padding: 3px 8px;
    border-radius: 6px;
  }
  .exercise-card .ex-name {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: -0.3px;
    margin-top: 8px;
  }
  .exercise-card .ex-meta {
    display: flex;
    gap: 16px;
    margin-bottom: 16px;
  }
  .exercise-card .meta-item {
    text-align: center;
  }
  .exercise-card .meta-label {
    font-size: 10px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 4px;
  }
  .exercise-card .meta-value {
    font-size: 18px;
    font-weight: 700;
    color: var(--neon);
  }
  .ex-obs {
    font-size: 11px;
    font-style: italic;
    color: var(--text-muted);
    margin-top: 4px;
    line-height: 1.4;
  }

  /* ── INPUT GRID ── */
  .input-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .input-group {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .input-group label {
    font-size: 10px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: 600;
  }
  .input-group input,
  .input-group select {
    background: var(--bg-input);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-sm);
    padding: 12px 14px;
    color: var(--text-primary);
    font-size: 16px;
    font-weight: 600;
    font-family: "Inter", sans-serif;
    transition: var(--transition);
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
  }
  .input-group input:focus,
  .input-group select:focus {
    outline: none;
    border-color: var(--neon);
    box-shadow: 0 0 0 3px var(--neon-dim);
  }
  .input-group input::placeholder {
    color: var(--text-muted);
  }

  /* ── SET ROWS & COLLAPSE ── */
  .set-row {
    transition: var(--transition);
  }
  .set-row input {
    padding: 10px !important;
    font-size: 14px !important;
    text-align: center;
  }
  .collapse-icon {
    font-size: 12px;
    color: var(--text-muted);
    transition: transform 0.3s ease;
  }
  .ex-body-wrapper {
    display: grid;
    grid-template-rows: 1fr;
    transition: grid-template-rows 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .ex-body-wrapper.collapsed {
    grid-template-rows: 0fr;
  }
  .ex-body-inner {
    overflow: hidden;
  }

  /* ── BUTTONS ── */
  .btn-neon {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: var(--radius);
    background: var(--neon);
    color: #000;
    font-size: 14px;
    font-weight: 700;
    font-family: "Inter", sans-serif;
    cursor: pointer;
    transition: var(--transition);
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .btn-neon:hover {
    box-shadow: 0 0 24px var(--neon-glow);
    transform: translateY(-1px);
  }
  .btn-neon:active {
    transform: translateY(0);
  }
  .btn-neon:disabled {
    opacity: 0.4;
    pointer-events: none;
  }

  .btn-ghost {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 12px;
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius);
    background: transparent;
    color: var(--text-secondary);
    font-size: 13px;
    font-weight: 600;
    font-family: "Inter", sans-serif;
    cursor: pointer;
    transition: var(--transition);
  }
  .btn-ghost:hover {
    border-color: var(--neon);
    color: var(--neon);
  }

  /* ── WEEK SELECTOR ── */
  .week-selector {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
  }
  .week-btn {
    flex: 1;
    padding: 10px;
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-sm);
    background: transparent;
    color: var(--text-secondary);
    font-size: 12px;
    font-weight: 600;
    font-family: "Inter", sans-serif;
    cursor: pointer;
    transition: var(--transition);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .week-btn.active {
    background: var(--neon-dim);
    border-color: var(--neon);
    color: var(--neon);
  }

  /* ── PRESCRIPTION ROW ── */
  .rx-header {
    display: grid;
    grid-template-columns: 36px 1fr 50px 60px 50px;
    gap: 8px;
    padding: 8px 16px;
    margin-bottom: 4px;
  }
  .rx-header span {
    font-size: 10px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    text-align: center;
    font-weight: 600;
  }
  .rx-header span:nth-child(2) {
    text-align: left;
  }
  .rx-row {
    display: grid;
    grid-template-columns: 36px 1fr 50px 60px 50px;
    align-items: center;
    gap: 8px;
    padding: 14px 16px;
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-radius: var(--radius-sm);
    margin-bottom: 8px;
    transition: var(--transition);
  }
  .rx-row:hover {
    border-color: rgba(57, 255, 20, 0.15);
  }
  .rx-order {
    font-size: 12px;
    font-weight: 800;
    color: var(--neon);
    text-align: center;
  }
  .rx-name {
    font-size: 14px;
    font-weight: 600;
  }
  .rx-val {
    text-align: center;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-secondary);
  }
  .rx-val.sets {
    color: var(--neon);
  }
  .rx-obs {
    font-size: 10px;
    font-style: italic;
    color: var(--text-muted);
    margin-top: 2px;
    grid-column: 2 / -1;
  }

  .rx-treino-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px;
    background: rgba(57, 255, 20, 0.05);
    border: 1px solid var(--neon-dim);
    border-radius: var(--radius);
    margin-top: 16px;
    cursor: pointer;
    color: var(--neon);
    font-weight: 700;
    font-size: 14px;
    transition: var(--transition);
    margin-bottom: 8px;
  }
  .rx-treino-header:hover {
    background: rgba(57, 255, 20, 0.1);
  }
  .rx-body-wrapper {
    display: grid;
    grid-template-rows: 1fr;
    transition: grid-template-rows 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .rx-body-wrapper.collapsed {
    grid-template-rows: 0fr;
  }
  .rx-body-inner {
    overflow: hidden;
  }

  /* ── KPI CARDS ── */
  .kpi-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 20px;
  }
  .kpi-card {
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-radius: var(--radius);
    padding: 16px;
    text-align: center;
    transition: var(--transition);
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
  }
  .kpi-card:hover {
    border-color: rgba(57, 255, 20, 0.2);
    transform: translateY(-2px);
  }
  .kpi-card .kpi-value {
    font-size: 26px;
    font-weight: 800;
    color: var(--neon);
    letter-spacing: -1px;
  }
  .kpi-card .kpi-label {
    font-size: 10px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-top: 4px;
  }
  .kpi-card .kpi-sub {
    font-size: 11px;
    color: var(--text-secondary);
    margin-top: 2px;
  }

  /* ── SVG CHART CONTAINER ── */
  .chart-container {
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 16px;
    overflow: hidden;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
  }
  .chart-container .chart-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 16px;
  }
  .chart-container svg {
    width: 100%;
    height: auto;
    display: block;
  }
  .chart-container svg text {
    fill: var(--text-muted);
    font-family: "Inter", sans-serif;
    font-size: 10px;
  }
  .chart-container svg .axis-line {
    stroke: var(--border-subtle);
    stroke-width: 1;
  }
  .chart-container svg .grid-line {
    stroke: var(--border-subtle);
    stroke-width: 0.5;
    stroke-dasharray: 4 4;
  }
  .chart-container svg .bar-volume {
    fill: var(--neon);
    opacity: 0.8;
    rx: 3;
  }
  .chart-container svg .bar-volume:hover {
    opacity: 1;
  }
  .chart-container svg .line-rpe {
    stroke: var(--warning);
    stroke-width: 2;
    fill: none;
  }
  .chart-container svg .dot-rpe {
    fill: var(--warning);
  }
  .chart-container svg .line-e1rm {
    stroke: var(--neon);
    stroke-width: 2;
    fill: none;
  }
  .chart-container svg .dot-e1rm {
    fill: var(--neon);
  }
  .chart-container svg .area-fill {
    opacity: 0.08;
  }
  .chart-container svg .label-value {
    fill: var(--text-primary);
    font-weight: 600;
    font-size: 9px;
  }

  /* ── EXERCISE FILTER (Dashboard) ── */
  .exercise-filter {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
    overflow-x: auto;
    scrollbar-width: none;
    -ms-overflow-style: none;
    padding-bottom: 4px;
  }
  .exercise-filter::-webkit-scrollbar {
    display: none;
  }
  .exercise-filter-btn {
    white-space: nowrap;
    padding: 8px 14px;
    border: 1px solid var(--border-subtle);
    border-radius: 20px;
    background: transparent;
    color: var(--text-secondary);
    font-size: 11px;
    font-weight: 600;
    font-family: "Inter", sans-serif;
    cursor: pointer;
    transition: var(--transition);
  }
  .exercise-filter-btn.active {
    background: var(--neon-dim);
    border-color: var(--neon);
    color: var(--neon);
  }

  /* ── RPE SESSION MODAL ── */
  .rpe-modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.85);
    backdrop-filter: blur(12px);
    z-index: 2000;
    display: none;
    align-items: center;
    justify-content: center;
  }
  .rpe-modal-overlay.show {
    display: flex;
  }
  .rpe-modal {
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    border-radius: 20px;
    padding: 32px 24px;
    width: 90%;
    max-width: 380px;
    text-align: center;
  }
  .rpe-modal h2 {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 8px;
  }
  .rpe-modal p {
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 24px;
  }
  .rpe-modal .rpe-big {
    font-size: 64px;
    font-weight: 900;
    color: var(--neon);
    margin: 16px 0;
  }
  .rpe-modal .rpe-scale {
    font-size: 11px;
    color: var(--text-muted);
    margin-bottom: 20px;
  }
  .rpe-slider {
    width: 100%;
    -webkit-appearance: none;
    appearance: none;
    height: 6px;
    border-radius: 3px;
    outline: none;
    background: linear-gradient(
      90deg,
      var(--rpe-low) 0%,
      var(--rpe-mid) 50%,
      var(--rpe-high) 100%
    );
  }
  .rpe-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--text-primary);
    cursor: pointer;
    border: 3px solid var(--neon);
  }

  /* ── BOTTOM NAV ── */
  .bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: var(--nav-height);
    padding-bottom: var(--safe-bottom);
    background: rgba(0, 0, 0, 0.92);
    backdrop-filter: blur(24px);
    border-top: 1px solid var(--border-subtle);
    display: flex;
    align-items: center;
    justify-content: space-around;
    z-index: 1000;
  }
  .nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 8px 16px;
    cursor: pointer;
    transition: var(--transition);
    position: relative;
    background: none;
    border: none;
    font-family: "Inter", sans-serif;
  }
  .nav-item .nav-icon {
    font-size: 22px;
    transition: var(--transition);
  }
  .nav-item .nav-label {
    font-size: 10px;
    font-weight: 600;
    color: var(--text-muted);
    letter-spacing: 0.5px;
    transition: var(--transition);
  }
  .nav-item.active .nav-icon {
    filter: drop-shadow(0 0 8px var(--neon-glow));
  }
  .nav-item.active .nav-label {
    color: var(--neon);
  }
  .nav-item::after {
    content: "";
    position: absolute;
    top: -1px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 2px;
    background: var(--neon);
    border-radius: 0 0 2px 2px;
    transition: var(--transition);
  }
  .nav-item.active::after {
    width: 32px;
  }

  /* ── SKELETON / TOAST ── */
  .skeleton {
    background: linear-gradient(
      90deg,
      var(--bg-card) 25%,
      #1a1a1a 50%,
      var(--bg-card) 75%
    );
    background-size: 200% 100%;
    animation: shimmer 1.5s infinite;
    border-radius: var(--radius-sm);
  }
  @keyframes shimmer {
    0% {
      background-position: 200% 0;
    }
    100% {
      background-position: -200% 0;
    }
  }

  .toast {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(-100px);
    padding: 12px 20px;
    border-radius: var(--radius);
    font-size: 13px;
    font-weight: 600;
    z-index: 9999;
    transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    pointer-events: none;
  }
  .toast.show {
    transform: translateX(-50%) translateY(0);
  }
  .toast.success {
    background: var(--neon);
    color: #000;
  }
  .toast.error {
    background: var(--danger);
    color: #fff;
  }
  .toast.warning {
    background: var(--warning);
