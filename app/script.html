function xsUniquePush(list, value) {
  if (value && list.indexOf(value) === -1) list.push(value);
}

function xsObjectValues(obj) {
  var values = [];
  var source = obj || {};
  Object.keys(source).forEach(function (key) {
    values.push(source[key]);
  });
  return values;
}

function xsEachNode(nodes, callback) {
  for (var i = 0; i < nodes.length; i++) {
    callback(nodes[i], i);
  }
}

function xsEscapeHtml(value) {
  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function xsEscapeJsString(value) {
  return String(value || "")
    .replace(/\\/g, "\\\\")
    .replace(/'/g, "\\'")
    .replace(/\r?\n/g, " ");
}

function xsSelectOptions(values, selected, includeAll) {
  var html = includeAll ? '<option value="">Todos</option>' : "";
  (values || []).forEach(function (value) {
    var sel = String(value) === String(selected) ? " selected" : "";
    html += '<option value="' + xsEscapeHtml(value) + '"' + sel + ">" + xsEscapeHtml(value) + "</option>";
  });
  return html;
}

  fetchServerAction: function fetchServerAction(action, payload) {
    var route = SERVER_ROUTES[action];
    if (!route) {
      return Promise.reject(new Error("Ação não mapeada: " + action));
    }
    var url = route.path;
    var bodyPayload = payload || null;
    if (action === "savePrescricaoTreino") {
      if (!payload || !payload.id_ficha || !payload.id_treino) {
        return Promise.reject(new Error("Ficha e treino são obrigatórios."));
      }
      url += "/" + encodeURIComponent(payload.id_ficha) + "/" + encodeURIComponent(payload.id_treino);
      bodyPayload = { exercicios: payload.exercicios || [] };
    }
    var sessionSuffixes = {
      saveTrainingSessionExercises: "exercises",
      saveTrainingSessionSets: "sets",
      completeTrainingSession: "complete",
      cancelTrainingSession: "cancel"
    };
    if (sessionSuffixes[action]) {
      if (!payload || !payload.session_id) {
        return Promise.reject(new Error("Sessão de treino obrigatória."));
      }
      url += "/" + encodeURIComponent(payload.session_id) + "/" + sessionSuffixes[action];
      bodyPayload = {};
      Object.keys(payload).forEach(function (key) {
        if (key !== "session_id") bodyPayload[key] = payload[key];
      });
    }
    var options = route.method === "GET" ? {
      method: route.method,
      credentials: "same-origin",
      headers: {
        Accept: "application/json"
      }
    } : {
      method: route.method,
      credentials: "same-origin",
      headers: {
        "Content-Type": "application/json",
        Accept: "application/json"
      },
      body: JSON.stringify(bodyPayload)
    };
    return fetch(url, options).then(function (response) {
      return response.json().catch(function () {
        return null;
      }).then(function (result) {
        if (!response.ok) {
          var apiError = new Error(result && result.error || "HTTP " + response.status);
          apiError.status = response.status;
          apiError.code = result && result.code || "HTTP_ERROR";
          apiError.details = result && result.details || {};
          throw apiError;
        }
        return result;
      });
    }).then(function (result) {
      if (!result || result.success === false) {
        var apiError = new Error(result && result.error || "Falha em " + action);
        apiError.status = 200;
        apiError.code = result && result.code || "API_ERROR";
        apiError.details = result && result.details || {};
        throw apiError;
      }
      if (result.success === true && result.data === null && action.indexOf("get") === 0 && action !== "getActiveTrainingSession") {
        throw new Error("Resposta vazia em " + action);
      }
      return result.data !== undefined ? result.data : result;
    });
  },

  syncCatalogFromReference: function syncCatalogFromReference() {

        lastError: err.message || "Não foi possível atualizar o catálogo."
      };

      _thisCatalogSync.showToast(err.message || "Não foi possível atualizar o catálogo", "error");

  applyPrescriptionEditorData: function applyPrescriptionEditorData(data) {
    data = data || {};
    var catalogo = data.catalogo || {};
    var prescricao = data.prescricao || {};
    this.catalogoCache = catalogo.rows || [];
    this.catalogoMeta = {
      grupos: catalogo.grupos || [],
      tipos: catalogo.tipos || [],
      musculos: catalogo.musculos || []
    };
    if (prescricao.rows) {
      this.prescricaoCache = prescricao.rows;

  initializePrescreverDraft: function initializePrescreverDraft() {
    var fichaInput = document.getElementById("prescrever-ficha");
    var treinoInput = document.getElementById("prescrever-treino");
    var ficha = fichaInput && fichaInput.value ? fichaInput.value : this.selectedFicha;
    var treino = treinoInput && treinoInput.value ? treinoInput.value : this.selectedTreino;
    var fichas = this.getPrescricaoFichas();
    if (!ficha && fichas.length > 0) ficha = fichas[0];
    var treinos = this.getTreinosForFicha(ficha);
    if (!treino && treinos.length > 0) treino = treinos[0];
    this.selectedFicha = ficha || "";
    this.selectedTreino = treino || "";
    this.prescreverDraft = {
      id_ficha: this.selectedFicha,

    };

  getPrescricaoFichas: function getPrescricaoFichas() {

    });
    return fichas.sort();
  },
  getTreinosForFicha: function getTreinosForFicha(ficha) {
    var treinos = [];
    this.prescricaoCache.forEach(function (row) {
      if (String(row.id_ficha) === String(ficha)) xsUniquePush(treinos, row.id_treino);

  clonePrescricaoRows: function clonePrescricaoRows(ficha, treino) {
    var rows = [];
    this.prescricaoCache.forEach(function (row) {
      if (String(row.id_ficha) === String(ficha) && String(row.id_treino) === String(treino)) {
        rows.push({
          id_exercicio: row.id_exercicio || row.nome_exercicio,
          nome_exercicio: row.nome_exercicio || row.id_exercicio,
          observacoes: row.observacoes || "",
          ordem_exercicio: row.ordem_exercicio || rows.length + 1,
          semana_1_sets: row.semana_1_sets || "",
          semana_1_reps: row.semana_1_reps || "",
          semana_1_descanso: row.semana_1_descanso || "",
          semana_2_sets: row.semana_2_sets || "",
          semana_2_reps: row.semana_2_reps || "",
          semana_2_descanso: row.semana_2_descanso || "",
          semana_3_sets: row.semana_3_sets || "",
          semana_3_reps: row.semana_3_reps || "",
          semana_3_descanso: row.semana_3_descanso || "",

          semana_4_reps: row.semana_4_reps || "",

  getCatalogMap: function getCatalogMap() {
    var map = {};
    this.catalogoCache.forEach(function (ex) {
      map[String(ex.nome || ex.id_exercicio || "").toLowerCase()] = ex;
    });
    return map;
  },
  calculateDemandSummary: function calculateDemandSummary(rows) {
    var result = {};
    var musculos = (this.catalogoMeta || {}).musculos || [];
    var catalogMap = this.getCatalogMap();
    for (var m = 0; m < musculos.length; m++) result[musculos[m]] = 0;
    rows.forEach(function (row) {
      var name = String(row.id_exercicio || row.nome_exercicio || "").toLowerCase();
      var catalog = catalogMap[name];
      if (!catalog || !catalog.demandas) return;
      var sets = parseFloat(row["semana_" + App.currentWeek + "_sets"]) || 0;
      musculos.forEach(function (musculo) {
        result[musculo] += (parseFloat(catalog.demandas[musculo]) || 0) * sets;
      });
    });
    return result;
  },
  getDemandRowsForScope: function getDemandRowsForScope(scope) {
    var draft = this.prescreverDraft || { exercicios: [] };
    var rows = [];
    if (scope === "ficha") {
      this.prescricaoCache.forEach(function (row) {
        if (String(row.id_ficha) === String(draft.id_ficha) && String(row.id_treino) !== String(draft.id_treino)) {
          rows.push(row);
        }
      });
    }
    (draft.exercicios || []).forEach(function (row) {
      var copy = {};
      Object.keys(row).forEach(function (key) {
        copy[key] = row[key];
      });
      copy.id_ficha = draft.id_ficha;
      copy.id_treino = draft.id_treino;
      rows.push(copy);
    });
    return rows;
  },
  calculateDemandDetails: function calculateDemandDetails(rows) {
    var details = [];
    var musculos = (this.catalogoMeta || {}).musculos || [];
    var catalogMap = this.getCatalogMap();
    for (var m = 0; m < musculos.length; m++) {
      details.push({
        musculo: musculos[m],
        total: 0,
        sources: []
      });
    }
    rows.forEach(function (row) {
      var name = String(row.id_exercicio || row.nome_exercicio || "").toLowerCase();
      var catalog = catalogMap[name];
      if (!catalog || !catalog.demandas) return;
      var sets = parseFloat(row["semana_" + App.currentWeek + "_sets"]) || 0;
      for (var i = 0; i < details.length; i++) {
        var detail = details[i];
        var factor = parseFloat(catalog.demandas[detail.musculo]) || 0;
        var contribution = factor * sets;
        detail.total += contribution;
        if (contribution > 0) {
          detail.sources.push({
            exercicio: row.nome_exercicio || row.id_exercicio,
            treino: row.id_treino || "",
            sets: sets,
            fator: factor,
            demanda: contribution
          });
        }
      }
    });
    details.sort(function (a, b) {
      return b.total - a.total;
    });
    return details;
  },
  renderPrescreverDemandSummary: function renderPrescreverDemandSummary() {
    var box = document.getElementById("prescrever-demand-summary");
    if (!box || !this.prescreverDraft) return;
    var sessao = this.calculateDemandSummary(this.getDemandRowsForScope("sessao"));
    var ficha = this.calculateDemandSummary(this.getDemandRowsForScope("ficha"));
    box.innerHTML = '<div class="demand-grid"><div class="demand-card" onclick="App.openDemandModal(\'sessao\')"><div class="demand-title">Sessão · Ciclo ' + this.currentWeek + '</div>' + this.renderDemandBars(sessao) + '</div><div class="demand-card" onclick="App.openDemandModal(\'ficha\')"><div class="demand-title">Ficha · Ciclo ' + this.currentWeek + '</div>' + this.renderDemandBars(ficha) + "</div></div>";
  },
  renderDemandBars: function renderDemandBars(summary) {
    var rows = [];
    Object.keys(summary || {}).forEach(function (musculo) {
      rows.push({ musculo: musculo, valor: summary[musculo] });
    });
    rows.sort(function (a, b) {
      return b.valor - a.valor;
    });
    rows = rows.slice(0, 5);
    if (rows.length === 0) return '<div class="empty-mini">Sem demanda calculada</div>';
    var max = rows[0].valor || 1;
    var html = "";
    rows.forEach(function (row) {
      var width = Math.round(row.valor / max * 100);
      html += '<div class="demand-row"><span>' + xsEscapeHtml(row.musculo) + '</span><div class="demand-bar"><i style="width:' + width + '%"></i></div><strong>' + Math.round(row.valor * 10) / 10 + "</strong></div>";
    });
    return html;
  },

  savePrescricaoTreino: function savePrescricaoTreino() {

    t.textContent = msg;
    t.className = "toast " + type;
    setTimeout(function () {
      t.classList.add("show");
    }, 0);
    clearTimeout(this._tt);
    this._tt = setTimeout(function () {
      return t.classList.remove("show");
    }, 2500);
  }
};
if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", function () {
    return Auth.init().then(function () {});
  });
} else {
  Auth.init().then(function () {});
}
</script>
